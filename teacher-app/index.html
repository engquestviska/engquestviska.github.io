<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4338ca">
  <meta name="robots" content="noindex, nofollow">
  <title>EngQuest Teacher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=20261026">
</head>
<body>
  <!-- Login -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/></svg>
      </div>
      <h1>EngQuest Teacher</h1>
      <p class="login-note" id="loginNote">Log in once. The app remembers you on this phone.</p>
      <label for="loginUser">Username</label>
      <input id="loginUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="loginPass">Password</label>
      <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
      <p class="login-error" id="loginError" role="alert"></p>
      <button class="btn brand block" type="submit" id="loginBtn">Log in</button>
    </form>
  </section>

  <!-- App -->
  <div class="app" id="app" hidden>
    <header class="appbar">
      <div class="appbar-row">
        <h1 id="screenTitle">Attendance</h1>
        <button class="classpill" type="button" id="classPill" aria-haspopup="dialog">
          <span id="classLabel">Class</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
      <div class="appbar-row sub-row">
        <button class="subtitle" type="button" id="subtitle" tabindex="-1"></button>
        <button class="appbar-action" type="button" id="headerAction" hidden aria-label="More actions">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
      </div>
    </header>

    <main class="view" id="view"></main>

    <nav class="tabbar" id="tabbar" aria-label="Main">
      <a class="tab" href="#/attendance" data-tab="attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18M9 16l2 2 4-4"/></svg>
        <span>Attendance</span>
      </a>
      <a class="tab" href="#/submissions" data-tab="submissions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>
        <span>Inbox</span><b class="badge" hidden></b>
      </a>
      <a class="tab" href="#/xp" data-tab="xp">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>
        <span>XP</span>
      </a>
      <a class="tab" href="#/scores" data-tab="scores">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
        <span>Scores</span>
      </a>
      <a class="tab" href="#/more" data-tab="more">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        <span>More</span>
      </a>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastText"></span><button type="button" id="toastAction" hidden></button></div>
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>

  <script src="../shared/js/classes-20260617.js?v=20260712"></script>
  <script src="../shared/js/api.js"></script>
  <script>
    // Local testing only: fake data instead of the real backend.
    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]mock=1/.test(location.search)) {
      document.write('<script src="dev/mock-api.js"><\/script>');
    }
  </script>
  <script src="js/core.js?v=20261026"></script>
  <script src="js/session.js?v=20261026"></script>
  <script src="js/app.js?v=20261026"></script>
  <script src="js/screens/attendance.js?v=20261026"></script>
  <script src="js/screens/submissions.js?v=20261026"></script>
  <script src="js/screens/xp.js?v=20261026"></script>
  <script src="js/screens/scores.js?v=20261026"></script>
  <script src="js/screens/more.js?v=20261026"></script>
  <script>EQT.start();</script>
</body>
</html>
