<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ASAT Result - English Quest</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple:#7C3AED;
      --purple-dark:#4C1D95;
      --purple-soft:#EDE9FE;
      --purple-mid:#C4B5FD;
      --white:#FFFFFF;
      --off-white:#F9F7FF;
      --text-dark:#1E1040;
      --text-muted:#6B5B95;
      --border:#E5DEFF;
      --green:#10B981;
      --blue:#0EA5E9;
      --amber:#F59E0B;
      --red:#EF4444;
      --shadow:0 10px 28px rgba(76,29,149,0.10);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'IBM Plex Sans', sans-serif;
      background:var(--off-white);
      color:var(--text-dark);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }
    header {
      background:linear-gradient(135deg,#0F766E,var(--purple-dark));
      color:#fff;
      padding:30px 20px 82px;
      text-align:center;
      position:relative;
      overflow:hidden;
    }
    header::after {
      content:'';
      position:absolute;
      left:-5%;
      right:-5%;
      bottom:-34px;
      height:70px;
      background:var(--off-white);
      border-radius:50% 50% 0 0;
    }
    .hamburger {
      position:fixed;
      top:18px;
      right:20px;
      z-index:300;
      width:42px;
      height:42px;
      border:0;
      border-radius:12px;
      background:rgba(255,255,255,0.16);
      color:#fff;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      gap:5px;
      backdrop-filter:blur(8px);
    }
    .hamburger span { width:20px; height:2px; background:#fff; border-radius:2px; }
    .brand { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:12px; }
    .brand img { width:46px; height:46px; border-radius:50%; object-fit:cover; border:2px solid rgba(255,255,255,0.45); }
    .brand-text { text-align:left; }
    .brand-title { font-family:'Playfair Display', serif; font-size:1.42rem; font-weight:800; line-height:1; }
    .brand-sub { font-size:0.75rem; opacity:0.82; margin-top:4px; }
    .page-title { position:relative; z-index:1; font-family:'Playfair Display', serif; font-size:2rem; font-weight:800; }
    .page-sub { position:relative; z-index:1; margin-top:8px; font-size:0.9rem; opacity:0.86; }
    main {
      width:min(960px, calc(100% - 28px));
      margin:-46px auto 0;
      position:relative;
      z-index:2;
      flex:1;
    }
    .panel {
      background:#fff;
      border:1.5px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      overflow:hidden;
      margin-bottom:22px;
    }
    .panel-inner { padding:24px; }
    .panel-title {
      font-family:'Playfair Display', serif;
      font-size:1.2rem;
      font-weight:800;
      margin-bottom:18px;
    }
    .form-grid { display:grid; gap:16px; }
    label {
      display:block;
      font-size:0.72rem;
      font-weight:800;
      color:var(--text-muted);
      letter-spacing:0.14em;
      text-transform:uppercase;
      margin-bottom:8px;
    }
    select {
      width:100%;
      padding:14px 16px;
      border:1.5px solid var(--border);
      border-radius:14px;
      background:#FBFAFF;
      color:#16083A;
      font:500 0.98rem 'IBM Plex Sans', sans-serif;
      outline:none;
    }
    select:focus { border-color:var(--purple-mid); box-shadow:0 0 0 4px rgba(124,58,237,0.10); }
    .primary-btn {
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px 18px;
      margin-top:4px;
      background:linear-gradient(135deg,#0F766E,#115E59);
      color:#fff;
      font-weight:800;
      font-size:0.98rem;
      font-family:inherit;
      cursor:pointer;
    }
    .primary-btn:disabled { opacity:0.55; cursor:not-allowed; }
    .result-card { border-top:1.5px solid var(--border); display:none; }
    .profile-strip {
      background:linear-gradient(135deg,#0F766E,#4C1D95);
      color:#fff;
      padding:22px 24px;
      display:flex;
      align-items:center;
      gap:14px;
    }
    .avatar {
      width:52px;
      height:52px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,0.42);
      background:rgba(255,255,255,0.18);
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:'Playfair Display', serif;
      font-size:1.35rem;
      font-weight:800;
      flex:0 0 auto;
    }
    .profile-name { font-family:'Playfair Display', serif; font-size:1.25rem; font-weight:800; }
    .profile-meta { font-size:0.8rem; opacity:0.86; margin-top:3px; }
    .result-body { padding:24px; }
    .score-grid {
      display:grid;
      grid-template-columns:1.3fr repeat(3, 1fr);
      gap:12px;
      margin-bottom:16px;
    }
    .score-card {
      border:1.5px solid var(--border);
      border-radius:16px;
      background:#fff;
      padding:16px;
    }
    .score-card.main {
      background:linear-gradient(135deg,#ECFDF5,#EFF6FF);
      border-color:#A7F3D0;
    }
    .score-label {
      font-family:'IBM Plex Mono', monospace;
      font-size:0.68rem;
      font-weight:800;
      color:var(--text-muted);
      letter-spacing:0.12em;
      text-transform:uppercase;
      margin-bottom:8px;
    }
    .score-value {
      font-family:'Playfair Display', serif;
      font-size:2rem;
      line-height:1;
      font-weight:800;
      color:var(--text-dark);
    }
    .score-small { font-size:0.82rem; color:var(--text-muted); margin-top:6px; font-weight:700; }
    .progress-track {
      height:12px;
      border-radius:999px;
      background:#EDE9FE;
      overflow:hidden;
      margin:12px 0 18px;
    }
    .progress-fill {
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#10B981,#0EA5E9);
      width:0;
    }
    .encouragement {
      border:1.5px solid #FDE68A;
      background:#FFFBEB;
      color:#713F12;
      border-radius:16px;
      padding:16px 18px;
      font-size:0.92rem;
      line-height:1.55;
      font-weight:700;
      margin-bottom:16px;
    }
    .number-section {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
      margin-bottom:16px;
    }
    .number-box {
      border:1.5px solid var(--border);
      border-radius:16px;
      padding:16px;
      background:#fff;
    }
    .number-box.correct { border-color:#A7F3D0; background:#F0FDF4; }
    .number-box.wrong { border-color:#FECACA; background:#FEF2F2; }
    .pill-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .pill {
      min-width:30px;
      height:28px;
      padding:0 8px;
      border-radius:999px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      font-family:'IBM Plex Mono', monospace;
      font-size:0.78rem;
      font-weight:800;
    }
    .pill.correct { background:#D1FAE5; color:#065F46; }
    .pill.wrong { background:#FEE2E2; color:#991B1B; }
    details {
      border:1.5px solid var(--border);
      border-radius:16px;
      background:#fff;
      overflow:hidden;
    }
    summary {
      cursor:pointer;
      padding:15px 16px;
      font-weight:800;
      color:var(--text-dark);
      list-style:none;
    }
    summary::-webkit-details-marker { display:none; }
    .answer-grid {
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      gap:8px;
      padding:0 16px 16px;
    }
    .answer-cell {
      border-radius:12px;
      padding:10px;
      font-size:0.78rem;
      font-weight:800;
      border:1.5px solid var(--border);
      background:#FBFAFF;
    }
    .answer-cell.correct { border-color:#A7F3D0; background:#F0FDF4; color:#065F46; }
    .answer-cell.wrong { border-color:#FECACA; background:#FEF2F2; color:#991B1B; }
    .answer-cell.blank { border-color:#FDE68A; background:#FFFBEB; color:#92400E; }
    .answer-no { font-family:'IBM Plex Mono', monospace; opacity:0.72; margin-bottom:4px; }
    .empty-state {
      padding:30px 24px;
      text-align:center;
      color:var(--text-muted);
    }
    .empty-state strong { color:var(--text-dark); display:block; margin-bottom:6px; }
    footer {
      background:#1E1040;
      color:rgba(255,255,255,0.62);
      text-align:center;
      padding:22px;
      margin-top:46px;
      font-size:0.82rem;
    }
    footer strong { color:#C4B5FD; }
    .sidebar-overlay { position:fixed; inset:0; background:rgba(15,8,35,0.45); backdrop-filter:blur(4px); z-index:240; opacity:0; pointer-events:none; transition:opacity 0.25s; }
    .sidebar-overlay.open { opacity:1; pointer-events:auto; }
    .sidebar { position:fixed; top:0; right:-340px; width:320px; max-width:86vw; height:100vh; background:#1E1040; z-index:260; transition:right 0.28s ease; box-shadow:-12px 0 35px rgba(30,16,64,0.30); }
    .sidebar.open { right:0; }
    .sidebar-head { padding:22px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid rgba(255,255,255,0.1); }
    .sidebar-logo { width:42px; height:42px; border-radius:12px; object-fit:cover; }
    .sidebar-head-text { flex:1; min-width:0; }
    .sidebar-head-title { font-family:'Playfair Display',serif; color:#fff; font-size:1.1rem; font-weight:800; }
    .sidebar-head-sub { color:rgba(255,255,255,0.55); font-size:0.74rem; margin-top:2px; }
    .sidebar-close { background:rgba(255,255,255,0.08); border:0; color:#fff; width:32px; height:32px; border-radius:10px; cursor:pointer; }
    .sidebar-home-btn { display:flex; align-items:center; justify-content:space-between; margin:14px 12px; padding:14px; background:linear-gradient(135deg,#7C3AED,#5B21B6); color:#fff; text-decoration:none; border-radius:14px; }
    .sidebar-home-btn-text { font-weight:800; }
    .sidebar-home-btn-sub { font-size:0.72rem; opacity:0.75; margin-top:2px; }
    .sidebar-divider { height:1px; background:rgba(255,255,255,0.08); margin:10px 16px; }
    .sidebar-section { padding:0 12px; }
    .sidebar-section-label { color:rgba(255,255,255,0.45); font-size:0.68rem; text-transform:uppercase; letter-spacing:0.12em; font-weight:800; margin:0 4px 8px; }
    .sidebar-item { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px; color:#fff; text-decoration:none; }
    .sidebar-item:hover, .sidebar-item.active { background:rgba(255,255,255,0.08); }
    .sidebar-item-icon { width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; }
    .sidebar-item-name { font-size:0.88rem; font-weight:600; color:#fff; flex:1; }
    @media (max-width:760px) {
      header { padding-top:24px; }
      .page-title { font-size:1.65rem; }
      main { width:min(100% - 20px, 960px); }
      .panel-inner, .result-body { padding:18px; }
      .score-grid, .number-section { grid-template-columns:1fr; }
      .answer-grid { grid-template-columns:repeat(3, 1fr); }
      .brand { justify-content:flex-start; padding-right:54px; }
    }
  </style>
</head>
<body data-page="asat-result">
  <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Open menu"><span></span><span></span><span></span></button>
  <header>
    <div class="brand">
      <img src="logo.jpg" alt="English Quest logo"/>
      <div class="brand-text">
        <div class="brand-title">English Quest</div>
        <div class="brand-sub">SMA Negeri 6 Surakarta</div>
      </div>
    </div>
    <div class="page-title">ASAT Multiple Choice Result</div>
    <div class="page-sub">Check your score, review your answers, and keep moving forward.</div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-inner">
        <div class="panel-title">Find Your Result</div>
        <div class="form-grid">
          <div>
            <label for="classSelect">Your Class</label>
            <select id="classSelect" onchange="loadNames()"></select>
          </div>
          <div>
            <label for="nameSelect">Your Name</label>
            <select id="nameSelect" onchange="updateButton()" disabled><option value="">Select class first</option></select>
          </div>
          <button class="primary-btn" id="viewBtn" disabled onclick="showResult()">View My Result</button>
        </div>
      </div>
      <div class="result-card" id="resultCard"></div>
    </section>
  </main>

  <footer>&copy; 2026 <strong>English Quest</strong> · SMA Negeri 6 Surakarta · Built with heart by <strong>LaksMedia</strong></footer>

  <script src="asat-result-data.js"></script>
  <script src="sidebar.js"></script>
  <script>
    const results = window.ASAT_RESULTS || [];
    const meta = window.ASAT_RESULT_META || { totalQuestions: 45 };

    function classLabel(cls) {
      return String(cls || '').replace(/^XE(\d+)$/, 'X E-$1');
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[ch]));
    }

    function initialFor(name) {
      return String(name || '?').trim().charAt(0).toUpperCase() || '?';
    }

    function resultKey(item) {
      return item.className + '|' + item.no;
    }

    function byClass(cls) {
      return results.filter(item => item.className === cls).sort((a, b) => Number(a.no || 0) - Number(b.no || 0));
    }

    function init() {
      const classSelect = document.getElementById('classSelect');
      const classes = Array.from(new Set(results.map(item => item.className))).sort((a, b) => {
        return Number(a.replace('XE', '')) - Number(b.replace('XE', ''));
      });
      classSelect.innerHTML = '<option value="">Select your class</option>' + classes.map(cls => {
        return '<option value="' + escapeHtml(cls) + '">' + escapeHtml(classLabel(cls)) + '</option>';
      }).join('');

      const params = new URLSearchParams(window.location.search);
      const savedClass = params.get('cls') || localStorage.getItem('asat_result_cls') || localStorage.getItem('eq_student_class') || '';
      const savedNo = params.get('no') || localStorage.getItem('asat_result_no') || localStorage.getItem('eq_student_no') || '';
      if (savedClass) {
        classSelect.value = savedClass;
        loadNames(savedNo);
        if (savedNo) setTimeout(showResult, 0);
      }
    }

    function loadNames(preselectNo) {
      const cls = document.getElementById('classSelect').value;
      const nameSelect = document.getElementById('nameSelect');
      document.getElementById('resultCard').style.display = 'none';
      if (!cls) {
        nameSelect.innerHTML = '<option value="">Select class first</option>';
        nameSelect.disabled = true;
        updateButton();
        return;
      }
      const students = byClass(cls);
      nameSelect.innerHTML = '<option value="">Choose your name</option>' + students.map(item => {
        return '<option value="' + escapeHtml(item.no) + '">' + escapeHtml(item.name) + ' (No. ' + escapeHtml(item.no) + ')</option>';
      }).join('');
      nameSelect.disabled = false;
      if (preselectNo) nameSelect.value = String(preselectNo);
      updateButton();
    }

    function updateButton() {
      document.getElementById('viewBtn').disabled = !document.getElementById('classSelect').value || !document.getElementById('nameSelect').value;
    }

    function encouragementFor(item) {
      const pct = item.totalQuestions ? item.correctCount / item.totalQuestions : 0;
      if (item.status !== 'Selesai') {
        return 'Your result is not fully finished in the system yet. Stay calm, check with Mr. Laksma, and make sure your final ASAT data is complete.';
      }
      if (pct >= 0.82) {
        return 'Excellent work. You showed strong control of the material. Keep the momentum, and use the questions you missed as a small final polish.';
      }
      if (pct >= 0.65) {
        return 'Good work. You already have a solid base. Review the missed numbers carefully, because a focused review can lift your next result quickly.';
      }
      if (pct >= 0.45) {
        return 'You are still in the fight. This score gives you a clear map of what to review. Start from the wrong numbers, one small step at a time.';
      }
      return 'This result is not the end of your story. Begin with a few missed questions, ask when you are stuck, and build your confidence back slowly.';
    }

    function pillList(numbers, type) {
      if (!numbers || !numbers.length) return '<div class="score-small">None</div>';
      return '<div class="pill-list">' + numbers.map(no => '<span class="pill ' + type + '">' + no + '</span>').join('') + '</div>';
    }

    function answerGrid(item) {
      const answerKey = meta.answerKey || [];
      return '<details><summary>View answer review</summary><div class="answer-grid">' + item.answers.map((answer, index) => {
        const key = answerKey[index] || '-';
        const state = answer === '-' ? 'blank' : (answer === key ? 'correct' : 'wrong');
        return '<div class="answer-cell ' + escapeHtml(state) + '">' +
          '<div class="answer-no">No. ' + escapeHtml(index + 1) + '</div>' +
          '<div>Your: ' + escapeHtml(answer) + '</div>' +
          '<div>Key: ' + escapeHtml(key) + '</div>' +
        '</div>';
      }).join('') + '</div></details>';
    }

    function showResult() {
      const cls = document.getElementById('classSelect').value;
      const no = document.getElementById('nameSelect').value;
      const item = results.find(result => result.className === cls && String(result.no) === String(no));
      const result = document.getElementById('resultCard');
      localStorage.setItem('asat_result_cls', cls);
      localStorage.setItem('asat_result_no', no);

      if (!item) {
        result.innerHTML = '<div class="empty-state"><strong>No result found</strong>Check your class and name again.</div>';
        result.style.display = 'block';
        return;
      }

      const pct = item.totalQuestions ? Math.round((item.correctCount / item.totalQuestions) * 100) : 0;
      const profile = `
        <div class="profile-strip">
          <div class="avatar">${escapeHtml(initialFor(item.name))}</div>
          <div>
            <div class="profile-name">${escapeHtml(item.name)}</div>
            <div class="profile-meta">${escapeHtml(classLabel(item.className))} · No. ${escapeHtml(item.no)} · ${escapeHtml(item.status || '-')}</div>
          </div>
        </div>`;

      result.innerHTML = profile + `
        <div class="result-body">
          <div class="score-grid">
            <div class="score-card main">
              <div class="score-label">Score</div>
              <div class="score-value">${escapeHtml(item.scoreText)} / ${escapeHtml(item.totalQuestions)}</div>
              <div class="score-small">${pct}% correct · ${escapeHtml(item.summary || '')}</div>
            </div>
            <div class="score-card">
              <div class="score-label">Correct</div>
              <div class="score-value">${escapeHtml(item.correctCount)}</div>
              <div class="score-small">answers</div>
            </div>
            <div class="score-card">
              <div class="score-label">Wrong</div>
              <div class="score-value">${escapeHtml(item.wrongCount)}</div>
              <div class="score-small">answers</div>
            </div>
            <div class="score-card">
              <div class="score-label">Blank</div>
              <div class="score-value">${escapeHtml(item.blankCount)}</div>
              <div class="score-small">questions</div>
            </div>
          </div>
          <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
          <div class="encouragement">${escapeHtml(encouragementFor(item))}</div>
          <div class="number-section">
            <div class="number-box correct">
              <div class="score-label">Correct Numbers</div>
              ${pillList(item.correctNumbers, 'correct')}
            </div>
            <div class="number-box wrong">
              <div class="score-label">Wrong Numbers</div>
              ${pillList(item.wrongNumbers, 'wrong')}
            </div>
          </div>
          ${answerGrid(item)}
        </div>`;
      result.style.display = 'block';
      result.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }

    init();
  </script>
</body>
</html>
