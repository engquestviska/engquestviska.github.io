<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task Status · English Quest</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple: #7C3AED; --purple-light: #A78BFA; --purple-soft: #EDE9FE;
      --purple-mid: #C4B5FD; --white: #fff; --off-white: #F9F7FF;
      --text-dark: #1E1040; --text-muted: #6B5B95; --border: #E5DEFF;
      --accent: #F59E0B; --green: #10B981; --green-soft: #D1FAE5;
      --red: #EF4444; --red-soft: #FEE2E2;
    }
    body { font-family: 'IBM Plex Sans', sans-serif; background: var(--off-white); color: var(--text-dark); min-height: 100vh; }

    /* HEADER */
    header { background: linear-gradient(135deg, #7C3AED 0%, #5B21B6 50%, #4C1D95 100%); padding: 36px 20px 52px; text-align: center; position: relative; overflow: hidden; }
    header::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px); background-size: 28px 28px; pointer-events: none; }
    .back-btn { position: absolute; top: 20px; left: 20px; z-index: 2; background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.88rem; font-weight: 600; padding: 8px 18px; border-radius: 999px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .back-btn:hover { background: rgba(255,255,255,0.25); }
    .teacher-btn { position: absolute; top: 20px; right: 20px; z-index: 2; background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.3); color: #fff; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.88rem; font-weight: 600; padding: 8px 18px; border-radius: 999px; cursor: pointer; }
    .teacher-btn:hover { background: rgba(255,255,255,0.25); }
    .teacher-badge { position: absolute; top: 20px; right: 20px; z-index: 2; background: var(--accent); color: #fff; font-size: 0.85rem; font-weight: 700; padding: 8px 16px; border-radius: 999px; display: flex; align-items: center; gap: 8px; }
    .logout-x { cursor: pointer; }
    header h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem,5vw,2.8rem); font-weight: 800; color: #fff; position: relative; z-index: 1; }
    header h1 span { color: var(--accent); font-style: italic; }
    .header-sub { color: rgba(255,255,255,0.75); font-size: 0.95rem; margin-top: 8px; position: relative; z-index: 1; }
    .wave { display: block; width: 100%; margin-top: -2px; }

    /* TABS */
    .tab-bar { display: flex; background: var(--white); border-bottom: 2px solid var(--border); max-width: 860px; margin: 0 auto; }
    .tab-btn { flex: 1; padding: 16px; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.92rem; font-weight: 700; border: none; background: none; cursor: pointer; color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s; }
    .tab-btn.active { color: var(--purple); border-bottom-color: var(--purple); }
    .tab-btn.hidden { display: none; }

    main { max-width: 860px; margin: 0 auto; padding: 28px 16px 80px; }

    /* SELECTOR CARD */
    .card { background: var(--white); border: 1.5px solid var(--border); border-radius: 20px; padding: 24px 20px; margin-bottom: 20px; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .field select { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem; background: var(--off-white); color: var(--text-dark); outline: none; }
    .field select:focus { border-color: var(--purple-light); }
    .btn-primary { width: 100%; padding: 15px; background: linear-gradient(135deg, var(--purple), #5B21B6); color: #fff; font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 1rem; border: none; border-radius: 12px; cursor: pointer; margin-top: 4px; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── STUDENT TASK STATUS CARD ── */
    .status-card { background: var(--white); border: 1.5px solid var(--border); border-radius: 20px; overflow: hidden; margin-bottom: 20px; animation: slideUp 0.3s ease; }
    @keyframes slideUp { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }

    .profile-strip { background: linear-gradient(135deg, #7C3AED, #5B21B6); padding: 22px 24px; display: flex; align-items: center; gap: 16px; }
    .avatar { width: 54px; height: 54px; border-radius: 50%; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.4); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; font-family: 'Playfair Display', serif; font-weight: 700; color: #fff; }
    .profile-name { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; color: #fff; }
    .profile-meta { font-size: 0.82rem; color: rgba(255,255,255,0.7); margin-top: 3px; }

    /* Progress bar section */
    .progress-section { padding: 20px 24px; border-bottom: 1.5px solid var(--border); }
    .progress-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .progress-title { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .progress-count { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: var(--purple); }
    .progress-bar-wrap { background: var(--border); border-radius: 999px; height: 10px; overflow: hidden; }
    .progress-bar-fill { height: 10px; border-radius: 999px; background: linear-gradient(90deg, #10B981, #059669); transition: width 0.6s ease; }
    .progress-bar-fill.warn { background: linear-gradient(90deg, #F59E0B, #D97706); }
    .progress-bar-fill.bad  { background: linear-gradient(90deg, #EF4444, #DC2626); }

    /* Task grid */
    .tasks-section { padding: 20px 24px; }
    .tasks-chapter-label { font-size: 0.72rem; font-weight: 700; color: var(--purple-light); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'IBM Plex Mono', monospace; margin-bottom: 14px; }
    .tasks-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .task-chip { border-radius: 14px; padding: 14px 10px; text-align: center; border: 1.5px solid; transition: transform 0.15s; }
    .task-chip:hover { transform: translateY(-2px); }
    .task-chip.done    { background: var(--green-soft); border-color: #34D399; }
    .task-chip.missing { background: var(--red-soft);   border-color: #FCA5A5; }
    .task-chip-icon { font-size: 1.3rem; margin-bottom: 6px; }
    .task-chip-name { font-size: 0.75rem; font-weight: 700; font-family: 'IBM Plex Mono', monospace; color: var(--text-dark); margin-bottom: 4px; }
    .task-chip-label { font-size: 0.72rem; font-weight: 700; }
    .task-chip.done    .task-chip-label { color: #065F46; }
    .task-chip.missing .task-chip-label { color: #991B1B; }
    .task-preview-link { display:inline-flex; align-items:center; justify-content:center; width:100%; margin-top:10px; padding:7px 8px; border-radius:10px; background:#fff; border:1.5px solid rgba(16,185,129,0.35); color:#065F46; font-size:0.72rem; font-weight:800; font-family:'IBM Plex Mono',monospace; text-decoration:none; }
    .task-preview-link:hover { border-color:#10B981; background:#ECFDF5; }
    .sync-strip { margin:0 24px 16px; padding:14px 16px; border-radius:14px; border:1.5px solid #93C5FD; background:#EFF6FF; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
    .sync-strip-text { flex:1; min-width:190px; font-size:0.84rem; color:#1E3A8A; line-height:1.45; font-weight:600; }
    .sync-strip-btn { padding:9px 14px; border:none; border-radius:10px; background:linear-gradient(135deg,#0EA5E9,#0369A1); color:#fff; font-family:'IBM Plex Sans',sans-serif; font-size:0.82rem; font-weight:800; cursor:pointer; }
    .sync-strip-btn:disabled { opacity:0.55; cursor:not-allowed; }

    /* ── CHAPTER TABS (inside student card) ── */
    .ch-tabs-inner { display:flex; border-bottom:1.5px solid var(--border); }
    .ch-tab-inner { flex:1; padding:12px 8px; font-family:'IBM Plex Sans',sans-serif; font-size:0.88rem; font-weight:700; border:none; background:none; cursor:pointer; color:var(--text-muted); border-bottom:3px solid transparent; margin-bottom:-2px; transition:all 0.2s; }
    .ch-tab-inner.active { color:var(--purple); border-bottom-color:var(--purple); }

    /* ── TEACHER PANEL ── */
    .teacher-selector { background: var(--white); border: 1.5px solid var(--border); border-radius: 20px; padding: 24px 20px; margin-bottom: 20px; }
    .teacher-selector-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 18px; }

    .student-list-panel { background: var(--white); border: 1.5px solid var(--border); border-radius: 20px; overflow: hidden; margin-bottom: 20px; }
    .panel-header { padding: 16px 20px; background: var(--off-white); border-bottom: 1.5px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .panel-header-title { font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700; }
    .panel-header-sub { font-size: 0.8rem; color: var(--text-muted); }

    .student-task-row { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .student-task-row:last-child { border-bottom: none; }
    .str-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .str-no { font-size: 0.8rem; font-weight: 700; color: var(--purple-light); width: 24px; flex-shrink: 0; }
    .str-name { font-size: 0.95rem; font-weight: 600; flex: 1; }
    .str-progress { font-size: 0.78rem; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); }
    .str-chapter-label { font-size: 0.7rem; font-weight: 700; color: var(--purple-light); text-transform: uppercase; letter-spacing: 0.1em; font-family: 'IBM Plex Mono', monospace; margin-bottom: 6px; }
    .str-tasks { display: flex; flex-wrap: wrap; gap: 8px; }
    .task-toggle {
      padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--border);
      font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: 'IBM Plex Mono', monospace;
      background: var(--off-white); color: var(--text-muted); transition: all 0.15s;
    }
    .task-toggle.on  { background: var(--green-soft); border-color: #34D399; color: #065F46; }
    .task-toggle.saving { opacity: 0.5; cursor: not-allowed; }

    /* LOGIN MODAL */
    .overlay { position: fixed; inset: 0; background: rgba(30,16,64,0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
    .overlay.hidden { display: none; }
    .modal { background: var(--white); border-radius: 24px; padding: 36px 28px; width: 100%; max-width: 400px; }
    .modal-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 800; margin-bottom: 6px; }
    .modal-sub { font-size: 0.88rem; color: var(--text-muted); margin-bottom: 24px; }
    .modal-field { margin-bottom: 16px; }
    .modal-field label { display: block; font-size: 0.78rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 8px; }
    .modal-field input { width: 100%; padding: 14px 16px; border: 1.5px solid var(--border); border-radius: 12px; font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem; outline: none; }
    .modal-field input:focus { border-color: var(--purple-light); }
    .modal-error { font-size: 0.85rem; color: var(--red); margin-bottom: 14px; display: none; }
    .modal-btns { display: flex; gap: 10px; }
    .btn-login { flex: 1; padding: 14px; background: linear-gradient(135deg, var(--purple), #5B21B6); color: #fff; font-family: 'IBM Plex Sans', sans-serif; font-weight: 700; font-size: 1rem; border: none; border-radius: 12px; cursor: pointer; }
    .btn-cancel { padding: 14px 20px; background: var(--off-white); border: 1.5px solid var(--border); border-radius: 12px; font-family: 'IBM Plex Sans', sans-serif; font-size: 1rem; cursor: pointer; color: var(--text-muted); }

    /* LOADING */
    .loading { text-align: center; padding: 48px; color: var(--text-muted); }
    .spinner { display: inline-block; width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* TOAST */
    .toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--text-dark); color: #fff; padding: 12px 24px; border-radius: 999px; font-size: 0.9rem; font-weight: 500; transition: transform 0.3s; z-index: 999; white-space: nowrap; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.ok  { background: #059669; }
    .toast.err { background: #DC2626; }

    .hidden { display: none !important; }
    footer { background: var(--text-dark); color: rgba(255,255,255,0.5); text-align: center; padding: 20px; font-size: 0.85rem; }
    footer strong { color: var(--purple-light); }

    @media (max-width: 500px) {
      .tasks-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
      .profile-strip { padding: 18px 16px; }
      .progress-section, .tasks-section { padding: 16px; }
      .panel-header { flex-wrap: wrap; gap: 8px; }
      .panel-header-sub { display: none; }
      .panel-header button { width: 100%; margin-left: 0 !important; }
      .student-task-row { padding: 12px 14px; }
      .str-name { font-size: 0.88rem; }
    }

    .logout-btn { position: absolute; top: 20px; right: 20px; z-index: 2; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.25); color: rgba(255,255,255,0.85); font-size: 0.78rem; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-family: inherit; display: none; align-items: center; gap: 5px; }
    .logout-btn:hover { background: rgba(255,255,255,0.22); }
    .teacher-active .logout-btn { display: flex; }

    /* ── SIDEBAR (shared) ───────────────────────────────────── */
    .hamburger { position:absolute; top:20px; right:20px; z-index:10; background:rgba(255,255,255,0.15); border:1.5px solid rgba(255,255,255,0.3); border-radius:10px; width:40px; height:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer; padding:0; }
    .hamburger span { display:block; width:18px; height:2px; background:#fff; border-radius:999px; transition:all 0.3s; }
    .hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity:0; }
    .hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
    .sidebar-overlay { position:fixed; inset:0; background:rgba(15,10,40,0.6); backdrop-filter:blur(6px); z-index:300; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .sidebar-overlay.open { opacity:1; pointer-events:all; }
    .sidebar { position:fixed; top:0; right:0; height:100%; width:min(320px,85vw); background:#1E1040; z-index:301; transform:translateX(100%); transition:transform 0.35s cubic-bezier(0.34,1.1,0.64,1); display:flex; flex-direction:column; overflow-y:auto; }
    .sidebar.open { transform:translateX(0); }
    .sidebar-head { padding:24px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:12px; }
    .sidebar-logo { width:36px; height:36px; border-radius:10px; object-fit:cover; }
    .sidebar-head-text { flex:1; }
    .sidebar-head-title { font-family:'Playfair Display',serif; font-size:1rem; font-weight:800; color:#fff; }
    .sidebar-head-sub { font-size:0.7rem; color:rgba(255,255,255,0.45); margin-top:1px; }
    .sidebar-close { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; color:rgba(255,255,255,0.5); cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; }
    .sidebar-section { padding:14px 16px 4px; }
    .sidebar-section-label { font-size:0.65rem; font-weight:700; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:0.12em; font-family:'IBM Plex Mono',monospace; padding:0 4px; margin-bottom:6px; }
    .sidebar-item { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; text-decoration:none; transition:background 0.15s; margin-bottom:2px; }
    .sidebar-item:hover, .sidebar-item:active { background:rgba(255,255,255,0.08); }
    .sidebar-item.active { background:rgba(255,255,255,0.12); border-left:3px solid #A78BFA; padding-left:9px; }
    .sidebar-item-icon { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:0.95rem; flex-shrink:0; }
    .sidebar-item-name { font-size:0.88rem; font-weight:600; color:#fff; flex:1; }
    .sidebar-item-badge { font-size:0.6rem; font-weight:800; padding:2px 7px; border-radius:999px; font-family:'IBM Plex Mono',monospace; background:#F59E0B; color:#fff; }
    .sidebar-divider { height:1px; background:rgba(255,255,255,0.07); margin:8px 16px; }
    .sidebar-teacher { margin:12px 16px 20px; background:rgba(124,58,237,0.2); border:1px solid rgba(124,58,237,0.35); border-radius:14px; padding:12px 14px; }
    .sidebar-teacher-label { font-size:0.68rem; font-weight:700; color:#A78BFA; text-transform:uppercase; letter-spacing:0.08em; font-family:'IBM Plex Mono',monospace; margin-bottom:8px; }
    .sidebar-teacher-logged { font-size:0.82rem; color:#A78BFA; font-weight:600; display:flex; align-items:center; gap:8px; }
    .sidebar-teacher-logged span { cursor:pointer; color:rgba(255,255,255,0.4); font-size:0.75rem; margin-left:auto; }
    .sidebar-home-btn { display:flex; align-items:center; gap:10px; margin:12px 16px 4px; padding:11px 14px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:12px; text-decoration:none; }
    .sidebar-home-btn:hover { background:rgba(255,255,255,0.1); }
    .sidebar-home-btn-text { font-size:0.85rem; font-weight:700; color:#fff; }
    .sidebar-home-btn-sub { font-size:0.7rem; color:rgba(255,255,255,0.4); }

  </style>
  <script src="sidebar.js"></script>
  <script src="security-lock.js?v=20260522"></script>
</head>
<body data-page="tasks">

<!-- LOGIN MODAL -->
<div class="overlay hidden" id="loginModal">
  <div class="modal">
    <div class="modal-title">Teacher Login</div>
    <div class="modal-sub">Login to edit task status for all classes.</div>
    <div class="modal-field"><label>Username</label><input type="text" id="loginUser" placeholder="Username"/></div>
    <div class="modal-field"><label>Password</label><input type="password" id="loginPass" placeholder="Password" onkeydown="if(event.key==='Enter')doLogin()"/></div>
    <div class="modal-error" id="loginError">Incorrect username or password.</div>
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeLogin()">Cancel</button>
      <button class="btn-login" onclick="doLogin()">Login</button>
    </div>
  </div>
</div>

<!-- HEADER -->
<header>
  <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
  
  
  <a class="back-btn" href="index.html">← Back</a>
  <div id="headerRight">
    <button class="teacher-btn" onclick="openLogin()">🔑 Teacher</button>
  </div>
  <h1>Task <span>Status</span></h1>
  <p class="header-sub">English Quest · SMA Negeri 6 Surakarta</p>
</header>

<svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 48" preserveAspectRatio="none">
  <path fill="#4C1D95" d="M0,32 C360,0 1080,64 1440,32 L1440,0 L0,0 Z"/>
  <path fill="#F9F7FF" d="M0,48 C360,16 1080,64 1440,32 L1440,48 Z"/>
</svg>

<!-- TABS -->
<div class="tab-bar">
  <button class="tab-btn active" id="tabStudent" onclick="switchTab('student')">🎓 My Tasks</button>
  <button class="tab-btn hidden"  id="tabTeacher" onclick="switchTab('teacher')">📝 Teacher Panel</button>
</div>

<main>

  <!-- ── STUDENT TAB ── -->
  <div id="studentTab">
    <div class="card">
      <div class="card-title">📋 Check Your Task Status</div>
      <div class="field"><label>Your Class</label>
        <select id="sClassSelect" onchange="onSClassChange()">
          <option value="">— Select your class —</option>
          <option value="XE1">X E-1</option><option value="XE4">X E-4</option>
          <option value="XE5">X E-5</option><option value="XE6">X E-6</option>
          <option value="XE7">X E-7</option><option value="XE8">X E-8</option>
          <option value="XE9">X E-9</option><option value="XE10">X E-10</option>
          <option value="XE11">X E-11</option>
        </select>
      </div>
      <div class="field"><label>Your Name</label>
        <select id="sNameSelect" disabled><option>— Select class first —</option></select>
      </div>
      <button class="btn-primary" id="sViewBtn" onclick="viewTaskStatus()" disabled>View My Tasks</button>
    </div>
    <div id="studentResult"></div>
  </div>

  <!-- ── TEACHER TAB ── -->
  <div id="teacherTab" class="hidden">
    <div class="teacher-selector">
      <div class="teacher-selector-title">📝 Edit Task Status</div>
      <div class="field"><label>Class</label>

          <option value="">— Select a class —</option>
          <option value="XE1">X E-1</option><option value="XE4">X E-4</option>
          <option value="XE5">X E-5</option><option value="XE6">X E-6</option>

<div id="ch5FilesOverlay" style="display:none;position:fixed;inset:0;background:rgba(30,16,64,0.6);backdrop-filter:blur(6px);z-index:500;align-items:center;justify-content:center;padding:20px">
  <div style="background:#fff;border-radius:20px;padding:28px 24px;width:100%;max-width:420px;box-shadow:0 8px 40px rgba(124,58,237,0.18)">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <div>
        <div style="font-size:0.7rem;font-weight:700;color:var(--purple-light);text-transform:uppercase;letter-spacing:0.1em;font-family:'IBM Plex Mono',monospace">Chapter 5 Files</div>

<script>
  const API = 'https://script.google.com/macros/s/AKfycbxBTC4vnFB3A73QwThdRxrUruvUNZRlpwwLFBjt5C0cJGIh8wz461ZCn3b9Y6wWPpyAGg/exec';

  let isTeacher = false, savedUser = '', savedPass = '';
  let studentsCache = {}, currentTeacherClass = '';

  // Restore session
  savedUser = localStorage.getItem('eq_tu') || '';
  savedPass = localStorage.getItem('eq_tp') || '';
  if (savedUser && savedPass) verifyLogin(savedUser, savedPass, true);

  // ── API ──────────────────────────────────────────────────────
  async function apiGet(params) {
    const url = API + '?' + new URLSearchParams(params);
    try {
      const res = await fetch(url);
      if (res.ok) return await res.json();
    } catch(e) {}
    return new Promise((resolve, reject) => {
      const cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const p  = { ...params, callback: cb, _t: Date.now() };
      const script = document.createElement('script');
      script.async = true;
      const timer = setTimeout(() => { cleanup(); reject(new Error('Timeout')); }, 15000);
      function cleanup() { delete window[cb]; try { if (script.parentNode) script.parentNode.removeChild(script); } catch(e){} clearTimeout(timer); }
      window[cb]     = d => { cleanup(); resolve(d); };
      script.onerror = () => { cleanup(); reject(new Error('Network error')); };
      script.src = API + '?' + new URLSearchParams(p);
      (document.body || document.head).appendChild(script);
    });
  }

  // ── CACHE LAYER ─────────────────────────────────────────────
  var CACHE_TTL = 30 * 60 * 1000;
  function cacheKey(params) {
    var sorted = Object.keys(params).sort();
    return 'eq_cache_' + sorted.map(function(k) { return k + '=' + params[k]; }).join('_').replace(/[^a-zA-Z0-9_=]/g, '_');
  }
  function cacheGet(params) {
    try {
      var raw = localStorage.getItem(cacheKey(params));
      if (!raw) return null;
      var entry = JSON.parse(raw);
      if (Date.now() - entry.ts > CACHE_TTL) { localStorage.removeItem(cacheKey(params)); return null; }
      return entry.data;
    } catch(e) { return null; }
  }
  function cacheSet(params, data) {
    try { localStorage.setItem(cacheKey(params), JSON.stringify({ ts: Date.now(), data: data })); } catch(e) {}
  }
  async function cachedApiGet(params) {
    var cached = cacheGet(params);
    if (cached) {
      apiGet(params).then(function(fresh) { cacheSet(params, fresh); }).catch(function() {});
      return cached;
    }
    var data = await apiGet(params);
    cacheSet(params, data);
    return data;
  }


  async function apiPost(body) {
    try {
      const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (res.ok) return await res.json();
    } catch(e) {}
    return apiGet(body);
  }

  // ── TABS ─────────────────────────────────────────────────────
  function switchTab(tab) {
    document.getElementById('studentTab').classList.toggle('hidden', tab !== 'student');
    document.getElementById('teacherTab').classList.toggle('hidden', tab !== 'teacher');
    document.getElementById('tabStudent').classList.toggle('active', tab === 'student');
    document.getElementById('tabTeacher').classList.toggle('active', tab === 'teacher');
  }

  // ── LOGIN ────────────────────────────────────────────────────
  async function hashPass(plain) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(plain));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  function openLogin()  { document.getElementById('loginModal').classList.remove('hidden'); setTimeout(() => document.getElementById('loginUser').focus(), 100); }
  function closeLogin() { document.getElementById('loginModal').classList.add('hidden'); document.getElementById('loginError').style.display = 'none'; }

  async function doLogin() {
    const u = document.getElementById('loginUser').value.trim();
    const p = document.getElementById('loginPass').value.trim();
    await verifyLogin(u, p, false);
  }

  async function verifyLogin(u, p, silent) {
    try {
      const data = await apiGet({ action: 'checkLogin', username: u, password: p });
      if (data.ok) {
        // If silent (auto-login from localStorage), p is already a hash — don't re-hash
        const hashed = silent ? p : await hashPass(p);
        isTeacher = true; savedUser = u; savedPass = hashed;
        localStorage.setItem('eq_tu', u); localStorage.setItem('eq_tp', hashed);
        closeLogin();
        document.getElementById('headerRight').innerHTML = `<div class="teacher-badge">🎓 Teacher <span class="logout-x" onclick="logout()">✕</span></div>`;
        document.getElementById('tabTeacher').classList.remove('hidden');
        if (!silent) { showToast('✅ Logged in as Teacher', 'ok'); switchTab('teacher'); }
      } else {
        if (!silent) document.getElementById('loginError').style.display = 'block';
      }
    } catch(e) { if (!silent) showToast('Connection error', 'err'); }
  }

  function logout() {
    isTeacher = false; savedUser = ''; savedPass = '';
    localStorage.removeItem('eq_tu'); localStorage.removeItem('eq_tp');
    document.getElementById('headerRight').innerHTML = `<button class="teacher-btn" onclick="openLogin()">🔑 Teacher</button>`;
    document.getElementById('tabTeacher').classList.add('hidden');
    switchTab('student');
    showToast('Logged out');
  }

  // ── STUDENT — LOAD NAMES ──────────────────────────────────────
  async function onSClassChange() {
    const cls = document.getElementById('sClassSelect').value;
    const nameSelect = document.getElementById('sNameSelect');
    const viewBtn    = document.getElementById('sViewBtn');
    nameSelect.innerHTML = '<option>Loading...</option>';
    nameSelect.disabled = true; viewBtn.disabled = true;
    document.getElementById('studentResult').innerHTML = '';
    if (!cls) { nameSelect.innerHTML = '<option>— Select class first —</option>'; return; }
    try {
      let data = studentsCache[cls];
      if (!data) { data = await cachedApiGet({ action: 'getStudents', className: cls }); studentsCache[cls] = data; }
      if (data.error) { showToast(data.error, 'err'); return; }
      nameSelect.innerHTML = '<option value="">— Select your name —</option>';
      data.students.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.no;
        opt.textContent = s.name + (s.nickname ? ' (' + s.nickname + ')' : '');
        nameSelect.appendChild(opt);
      });
      nameSelect.disabled = false;
      nameSelect.onchange = () => { viewBtn.disabled = !nameSelect.value; };
    } catch(e) { showToast('Failed to load students', 'err'); nameSelect.innerHTML = '<option>— Select class first —</option>'; }
  }

  // ── STUDENT — VIEW TASKS ──────────────────────────────────────
  async function viewTaskStatus() {
    const cls = document.getElementById('sClassSelect').value;
    const no  = document.getElementById('sNameSelect').value;
    const clsLabel = document.getElementById('sClassSelect').options[document.getElementById('sClassSelect').selectedIndex].text;
    if (!cls || !no) return;
    document.getElementById('studentResult').innerHTML = '<div class="loading"><div class="spinner"></div><br/>Loading your tasks...</div>';
    document.getElementById('sViewBtn').disabled = true;
    document.getElementById('sViewBtn').textContent = '⏳ Loading...';
    try {
      // Load task status, submission status, and file previews in parallel
      const [data, subData, ch4Files, ch5Files] = await Promise.all([
        cachedApiGet({ action: 'getTaskStatus', className: cls, studentNo: no }),
        cachedApiGet({ action: 'getSubmissions' }).catch(function() { return null; }),
        apiGet({ action: 'getCh4StudentFiles', className: cls, studentNo: no, _t: Date.now() }).catch(function() { return null; }),
        apiGet({ action: 'getCh5StudentFiles', className: cls, studentNo: no, _t: Date.now() }).catch(function() { return null; })
      ]);
      if (data.error) { showToast(data.error, 'err'); document.getElementById('studentResult').innerHTML = ''; return; }

      // Check if this student has submitted Chapter 4
      var hasSubmitted = false;
      if (subData && subData.students && subData.students[cls]) {
        var studentName = data.name || '';
        var match = subData.students[cls].find(function(s) {
          return s.name.toLowerCase() === studentName.toLowerCase() && s.submitted;
        });
        if (match) {
          hasSubmitted = true;
        }
      }

      renderStudentTasks(data, clsLabel, hasSubmitted, {
        ch4: ch4Files && ch4Files.success ? (ch4Files.files || {}) : {},
        ch5: ch5Files && ch5Files.success ? (ch5Files.files || {}) : {}
      }, cls, no);
    } catch(e) { showToast('Failed to load tasks', 'err'); document.getElementById('studentResult').innerHTML = ''; }
    finally { document.getElementById('sViewBtn').disabled = false; document.getElementById('sViewBtn').textContent = 'View My Tasks'; }
  }

  function renderStudentTasks(data, clsLabel, hasSubmitted, submittedFiles, cls, no) {
    const tasks   = data.tasks;
    const keys    = Object.keys(tasks);
    const initial = data.nickname ? data.nickname[0].toUpperCase() : data.name[0].toUpperCase();
    const files   = submittedFiles || { ch4: {}, ch5: {} };

    const ch4Keys = keys.filter(k => /^C4T/i.test(k));
    const ch5Keys = keys.filter(k => /^C5T/i.test(k));

    const makeProgress = (ckeys, label) => {
      const done  = ckeys.filter(k => tasks[k]).length;
      const total = ckeys.length;
      const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
      const bar   = pct >= 80 ? '' : pct >= 50 ? 'warn' : 'bad';
      return `<div class="progress-section">
        <div class="progress-label">
          <div class="progress-title">${label} Progress</div>
          <div class="progress-count">${done} / ${total} Done</div>
        </div>
        <div class="progress-bar-wrap"><div class="progress-bar-fill ${bar}" style="width:${pct}%"></div></div>
      </div>`;
    };

    const escapeAttr = value => String(value || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

    const makeChips = (ckeys, chapterFiles) => ckeys.map(k => {
      const isDone = tasks[k];
      const m = k.match(/^C\d+T(\d+)$/i);
      const fileUrl = chapterFiles && chapterFiles[k];
      return `<div class="task-chip ${isDone ? 'done' : 'missing'}">
        <div class="task-chip-icon">${isDone ? '✅' : '❌'}</div>
        <div class="task-chip-name">${m ? 'Task ' + m[1] : k}</div>
        <div class="task-chip-label">${isDone ? 'Done' : 'Missing'}</div>
        ${fileUrl ? `<a class="task-preview-link" href="${escapeAttr(fileUrl)}" target="_blank" rel="noopener">Preview</a>` : ''}
      </div>`;
    }).join('');

    const ch4Panel = ch4Keys.length
      ? makeProgress(ch4Keys, 'Chapter 4') +
        (hasSubmitted ? '<div style="background:#D1FAE5;border:1.5px solid #6EE7B7;border-radius:12px;padding:12px 16px;margin:0 24px 16px;font-size:0.85rem;color:#065F46;font-weight:600;">&#10003; You submitted Chapter 4 — all tasks marked done.</div>' : '') +
        `<div class="tasks-section"><div class="tasks-grid">${makeChips(ch4Keys, files.ch4)}</div></div>`
      : '<div style="padding:32px;text-align:center;color:var(--text-muted)">No Chapter 4 tasks found.</div>';

    const ch5Panel = ch5Keys.length
      ? makeProgress(ch5Keys, 'Chapter 5') +
        `<div class="sync-strip">
          <div class="sync-strip-text">If your submitted files appear here but the tasks are still marked missing, sync Chapter 5 with the submission data.</div>
          <button class="sync-strip-btn" id="syncCh5StudentBtn" onclick="syncMyCh5('${escapeAttr(cls)}','${escapeAttr(no)}')">Sync Chapter 5</button>
        </div>` +
        `<div class="tasks-section"><div class="tasks-grid">${makeChips(ch5Keys, files.ch5)}</div></div>`
      : '<div style="padding:32px;text-align:center;"><div style="font-size:2rem;margin-bottom:8px;">🔄</div><div style="font-weight:700;margin-bottom:4px;">Chapter 5 Tasks Coming Soon</div><div style="font-size:0.85rem;color:var(--text-muted);">Check back when Chapter 5 begins.</div></div>';

    document.getElementById('studentResult').innerHTML = `
      <div class="status-card">
        <div class="profile-strip">
          <div class="avatar">${initial}</div>
          <div>
            <div class="profile-name">${data.nickname || data.name}</div>
            <div class="profile-meta">${data.name} · ${clsLabel}</div>
          </div>
        </div>
        <div class="ch-tabs-inner">
          <button class="ch-tab-inner active" id="ctab4" onclick="switchChapterTab(4)">Chapter 4</button>
          <button class="ch-tab-inner" id="ctab5" onclick="switchChapterTab(5)">Chapter 5</button>
        </div>
        <div id="ctabPanel4">${ch4Panel}</div>
        <div id="ctabPanel5" style="display:none">${ch5Panel}</div>
      </div>`;
  }

  function switchChapterTab(ch) {
    document.getElementById('ctab4').className = 'ch-tab-inner' + (ch === 4 ? ' active' : '');
    document.getElementById('ctab5').className = 'ch-tab-inner' + (ch === 5 ? ' active' : '');
    document.getElementById('ctabPanel4').style.display = ch === 4 ? '' : 'none';
    document.getElementById('ctabPanel5').style.display = ch === 5 ? '' : 'none';
  }

  async function syncMyCh5(cls, no) {
    const btn = document.getElementById('syncCh5StudentBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Syncing...'; }
    try {
      const res = await apiGet({ action: 'syncCh5Student', className: cls, studentNo: no, _t: Date.now() });
      if (res.error || !res.tasks) {
        showToast(res.error || 'No Chapter 5 submission found', 'err');
        if (btn) { btn.disabled = false; btn.textContent = 'Sync Chapter 5'; }
        return;
      }
      localStorage.removeItem(cacheKey({ action: 'getTaskStatus', className: cls, studentNo: no }));
      showToast('Chapter 5 status synced', 'ok');
      await viewTaskStatus();
      setTimeout(function() { switchChapterTab(5); }, 0);
    } catch(e) {
      showToast('Sync failed. Try again.', 'err');
      if (btn) { btn.disabled = false; btn.textContent = 'Sync Chapter 5'; }
    }
  }

  // ── TEACHER — LOAD CLASS ──────────────────────────────────────
  async function loadTeacherClass() {
    const cls = document.getElementById('tClassSelect').value;
    if (!cls) { document.getElementById('teacherList').innerHTML = ''; return; }
    currentTeacherClass = cls;
    document.getElementById('teacherList').innerHTML = '<div class="loading"><div class="spinner"></div><br/>Loading class...</div>';
    try {
      const data = await apiGet({ action: 'getAllTasks', className: cls });
      if (data.error) { showToast(data.error, 'err'); document.getElementById('teacherList').innerHTML = ''; return; }
      renderTeacherPanel(data, cls);
    } catch(e) { showToast('Failed to load class', 'err'); document.getElementById('teacherList').innerHTML = ''; }
  }

  function renderTeacherPanel(data, cls) {
    const { students, taskKeys } = data;
    const ch4Keys = taskKeys.filter(k => /^C4T/i.test(k));
    const ch5Keys = taskKeys.filter(k => /^C5T/i.test(k));

    const makeBtns = (s, keys) => keys.map(k => `
      <button class="task-toggle ${s.tasks[k] ? 'on' : ''}" id="toggle-${s.no}-${k}"
        data-no="${s.no}" data-key="${k}" data-cls="${cls}">${k}</button>`).join('');

    const rows = students.map(s => {
      const done = taskKeys.filter(k => s.tasks[k]).length;
      const ch4done = ch4Keys.filter(k => s.tasks[k]).length;
      const ch5done = ch5Keys.filter(k => s.tasks[k]).length;

      const ch4Section = ch4Keys.length ? `
        <div class="str-chapter-label">Chapter 4</div>
        <div class="str-tasks">${makeBtns(s, ch4Keys)}</div>` : '';

      const ch5Section = ch5Keys.length ? `
        <div class="str-chapter-label" style="margin-top:8px;display:flex;align-items:center;gap:8px">Chapter 5
          <button onclick="viewCh5Files(${s.no},'${cls}')" style="background:none;border:1px solid rgba(124,58,237,0.35);border-radius:6px;padding:1px 8px;cursor:pointer;font-size:0.65rem;color:var(--purple);font-family:inherit;font-weight:700;line-height:1.6">&#128196; Files</button>
        </div>
        <div class="str-tasks">${makeBtns(s, ch5Keys)}</div>` : '';

      return `
        <div class="student-task-row">
          <div class="str-top">
            <span class="str-no">${s.no}</span>
            <span class="str-name">${s.nickname || s.name}</span>
            <span class="str-progress">${ch4done}/${ch4Keys.length} &nbsp;|&nbsp; ${ch5done}/${ch5Keys.length}</span>
          </div>
          ${ch4Section}${ch5Section}
        </div>`;
    }).join('');

    document.getElementById('teacherList').innerHTML = `
      <div class="student-list-panel">
        <div class="panel-header">
          <div class="panel-header-title">${cls} · Task Status</div>
          <div class="panel-header-sub">Tap to toggle ✓ / ✗</div>
          <div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap">
            <button onclick="syncSubmissionsToTasks('${cls}')" style="padding:7px 16px;background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:0.8rem;font-weight:700;cursor:pointer;">&#9889; Sync Ch4</button>
            <button id="bulkCh5Btn" onclick="bulkSyncCh5('${cls}')" style="padding:7px 16px;background:linear-gradient(135deg,#0EA5E9,#0369A1);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:0.8rem;font-weight:700;cursor:pointer;">&#128260; Sync Ch5 All</button>
          </div>
        </div>
        ${rows}
      </div>`;
  }

  // ── TOGGLE TASK ───────────────────────────────────────────────
  async function toggleTask(studentNo, taskKey, className) {
    const btn = document.getElementById('toggle-' + studentNo + '-' + taskKey);
    if (!btn || btn.classList.contains('saving')) return;
    const newVal = !btn.classList.contains('on');
    btn.classList.add('saving');
    btn.textContent = '...';
    try {
      const res = await apiGet({
        action: 'saveTaskStatus', username: savedUser, password: savedPass,
        className, studentNo: String(studentNo), tasks: JSON.stringify({ [taskKey]: newVal })
      });
      if (res.success) {
        btn.classList.toggle('on', newVal);
        btn.textContent = taskKey;
        // Update progress counter (split Ch4 / Ch5)
        const row = btn.closest('.student-task-row');
        const allBtns = [...row.querySelectorAll('.task-toggle')];
        const ch4Btns = allBtns.filter(b => /^C4T/i.test(b.dataset.key));
        const ch5Btns = allBtns.filter(b => /^C5T/i.test(b.dataset.key));
        const ch4Done = ch4Btns.filter(b => b.classList.contains('on')).length;
        const ch5Done = ch5Btns.filter(b => b.classList.contains('on')).length;
        const prog = row.querySelector('.str-progress');
        if (ch4Btns.length && ch5Btns.length) {
          prog.textContent = ch4Done + '/' + ch4Btns.length + ' | ' + ch5Done + '/' + ch5Btns.length;
        } else {
          const done = allBtns.filter(b => b.classList.contains('on')).length;
          prog.textContent = done + '/' + allBtns.length;
        }
        showToast(newVal ? '✅ Marked as done' : '❌ Marked as missing', newVal ? 'ok' : '');
      } else {
        showToast('Error: ' + res.error, 'err');
        btn.textContent = taskKey;
      }
    } catch(e) {
      showToast('Failed to save', 'err');
      btn.textContent = taskKey;
    }
    btn.classList.remove('saving');
  }

  // ── SYNC SUBMISSIONS → TASK STATUS ──────────────────────────
  async function syncSubmissionsToTasks(cls) {
    if (!savedUser || !savedPass) { showToast('Not logged in as teacher', 'err'); return; }

    // Find and disable the sync button, show progress
    const syncBtn = document.querySelector('[onclick*="syncSubmissionsToTasks"]');
    const origText = syncBtn ? syncBtn.textContent : '';
    if (syncBtn) { syncBtn.disabled = true; syncBtn.textContent = '⏳ Loading data...'; }

    try {
      // Get submissions and all tasks in parallel
      const [subData, taskData] = await Promise.all([
        apiGet({ action: 'getSubmissions' }),
        apiGet({ action: 'getAllTasks', className: cls })
      ]);

      if (subData.error || !subData.students) {
        showToast('Could not load submissions', 'err');
        if (syncBtn) { syncBtn.disabled = false; syncBtn.textContent = origText; }
        return;
      }
      if (taskData.error || !taskData.students) {
        showToast('Could not load task data', 'err');
        if (syncBtn) { syncBtn.disabled = false; syncBtn.textContent = origText; }
        return;
      }

      const submitted = subData.students[cls] || [];
      const ch4Keys   = taskData.taskKeys.filter(k => k.match(/^C4T/i));

      if (!ch4Keys.length) {
        showToast('No Chapter 4 task keys found', 'err');
        if (syncBtn) { syncBtn.disabled = false; syncBtn.textContent = origText; }
        return;
      }

      const tasksToSet = {};
      ch4Keys.forEach(k => { tasksToSet[k] = true; });

      // Only include students who fully submitted AND still have unchecked Ch4 tasks
      const toUpdate = [];
      taskData.students.forEach(function(s) {
        var sub = submitted.find(function(r) {
          return r.name.toLowerCase() === s.name.toLowerCase() && r.submitted === true;
        });
        if (!sub) return; // not submitted — skip
        // Skip if all Ch4 tasks already done
        var alreadyDone = ch4Keys.every(function(k) { return !!s.tasks[k]; });
        if (alreadyDone) return;
        toUpdate.push({ s: s, tasksToSet: tasksToSet });
      });

      if (!toUpdate.length) {
        showToast('All submitted students already up to date ✅', 'ok');
        if (syncBtn) { syncBtn.disabled = false; syncBtn.textContent = origText; }
        return;
      }

      // Save one by one with live progress on button
      let done = 0;
      for (const item of toUpdate) {
        if (syncBtn) syncBtn.textContent = '⏳ Saving ' + (done + 1) + '/' + toUpdate.length + '...';
        try {
          await apiGet({
            action: 'saveTaskStatus',
            username: savedUser, password: savedPass,
            className: cls, studentNo: String(item.s.no),
            tasks: JSON.stringify(item.tasksToSet)
          });
          done++;
        } catch(e) {}
      }

      if (syncBtn) { syncBtn.textContent = '✅ Done! Reloading...'; }
      showToast('✅ Synced ' + done + ' student(s) in ' + cls, 'ok');

      // Reload to show updated state
      setTimeout(function() {
        loadTeacherClass();
        if (syncBtn) { syncBtn.disabled = false; syncBtn.textContent = origText; }
      }, 1000);

    } catch(e) {
      showToast('Sync failed: ' + e.message, 'err');
      if (syncBtn) { syncBtn.disabled = false; syncBtn.textContent = origText; }
    }
  }

  // ── BULK CH5 SYNC ─────────────────────────────────────────────
  async function bulkSyncCh5(cls) {
    if (!savedUser || !savedPass) { showToast('Not logged in as teacher', 'err'); return; }
    const btn = document.getElementById('bulkCh5Btn');
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Syncing...'; }
    try {
      const res = await apiGet({ action: 'syncCh5Class', className: cls, username: savedUser, password: savedPass });
      if (res.success) {
        showToast('✅ Ch5 synced — ' + res.synced + ' updated, ' + res.notFound + ' no submission', 'ok');
        setTimeout(function() {
          loadTeacherClass();
          if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Ch5 All'; }
        }, 1000);
      } else {
        showToast('Ch5 sync failed: ' + (res.error || 'unknown error'), 'err');
        if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Ch5 All'; }
      }
    } catch(e) {
      showToast('Ch5 sync failed: ' + e.message, 'err');
      if (btn) { btn.disabled = false; btn.textContent = '🔄 Sync Ch5 All'; }
    }
  }

  // ── CH5 FILE VIEWER ───────────────────────────────────────────
  async function viewCh5Files(studentNo, cls) {
    const overlay = document.getElementById('ch5FilesOverlay');
    const nameEl  = document.getElementById('ch5FilesName');
    const listEl  = document.getElementById('ch5FilesList');
    nameEl.textContent = 'Loading...';
    listEl.innerHTML   = '<div style="text-align:center;padding:20px;color:var(--text-muted)">⏳ Fetching files...</div>';
    overlay.style.display = 'flex';
    try {
      const res = await apiGet({ action: 'getCh5StudentFiles', className: cls, studentNo: String(studentNo) });
      nameEl.textContent = res.studentName || 'Student';
      if (!res.success || !res.submitted) {
        listEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:0.88rem">No Ch5 submission found for this student.</div>';
        return;
      }
      const tasks = ['C5T1','C5T2','C5T3','C5T4','C5T5'];
      const items = tasks.map(function(k) {
        const url = (res.files || {})[k];
        const num = k.replace('C5T','');
        if (url) {
          return '<a href="' + url + '" target="_blank" style="display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--off-white);border:1.5px solid var(--border);border-radius:12px;margin-bottom:8px;text-decoration:none;color:var(--text-dark);font-weight:600;font-size:0.88rem;transition:border-color 0.15s" onmouseover="this.style.borderColor=\'#A78BFA\'" onmouseout="this.style.borderColor=\'var(--border)\'">' +
            '<span style="background:#D1FAE5;color:#065F46;border-radius:8px;padding:4px 10px;font-size:0.72rem;font-weight:700;font-family:\'IBM Plex Mono\',monospace;flex-shrink:0">Task ' + num + '</span>' +
            '<span style="flex:1">View file ↗</span>' +
            '</a>';
        }
        return '<div style="display:flex;align-items:center;gap:10px;padding:11px 14px;background:#F9FAFB;border:1.5px solid #E5E7EB;border-radius:12px;margin-bottom:8px;color:#9CA3AF;font-size:0.88rem">' +
          '<span style="background:#F3F4F6;color:#9CA3AF;border-radius:8px;padding:4px 10px;font-size:0.72rem;font-weight:700;font-family:\'IBM Plex Mono\',monospace;flex-shrink:0">Task ' + num + '</span>' +
          '<span>Not submitted</span></div>';
      }).join('');
      listEl.innerHTML = items;
    } catch(e) {
      listEl.innerHTML = '<div style="color:var(--red);font-size:0.88rem;padding:12px 0">Failed to load files.</div>';
    }
  }

  function closeFilesModal() {
    document.getElementById('ch5FilesOverlay').style.display = 'none';
  }
  document.getElementById('ch5FilesOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeFilesModal();
  });

  // ── TOAST ─────────────────────────────────────────────────────
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.className = 'toast ' + (type || '');
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  // Auto-select saved student — waits for page to be fully ready
  document.getElementById('teacherList').addEventListener('click', function(e) {
    const btn = e.target.closest('.task-toggle');
    if (!btn) return;
    toggleTask(+btn.dataset.no, btn.dataset.key, btn.dataset.cls);
  });

  document.addEventListener('DOMContentLoaded', function() {
    var cls = localStorage.getItem('eq_student_class');
    var no  = localStorage.getItem('eq_student_no');
    if (!cls || !no) return;
    var clsSel = document.getElementById('sClassSelect');
    if (!clsSel) return;
    clsSel.value = cls;
    onSClassChange().then(function() {
      var nameSel = document.getElementById('sNameSelect');
      if (!nameSel) return;
      nameSel.value = no;
      var viewBtn = document.getElementById('sViewBtn');
      if (viewBtn) { viewBtn.disabled = false; viewBtn.click(); }
    }).catch(function(){});
  });

</script>

</body>
</html>
