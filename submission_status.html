<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submission Status · English Quest</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --purple:#7C3AED; --purple-light:#A78BFA; --purple-soft:#EDE9FE; --purple-mid:#C4B5FD;
      --white:#fff; --off-white:#F9F7FF; --text-dark:#1E1040; --text-muted:#6B5B95; --border:#E5DEFF;
      --accent:#F59E0B; --green:#10B981; --red:#EF4444;
    }
    body { font-family:'IBM Plex Sans',sans-serif; background:var(--off-white); color:var(--text-dark); min-height:100vh; }

    header { background:linear-gradient(135deg,#7C3AED 0%,#5B21B6 50%,#4C1D95 100%); padding:36px 24px 52px; text-align:center; position:relative; overflow:hidden; }
    header::before { content:''; position:absolute; inset:0; background-image:radial-gradient(circle,rgba(255,255,255,0.08) 1px,transparent 1px); background-size:28px 28px; pointer-events:none; }
    .back-btn { position:absolute; top:20px; left:20px; z-index:2; background:rgba(255,255,255,0.15); border:1.5px solid rgba(255,255,255,0.3); color:#fff; font-size:0.88rem; font-weight:600; padding:8px 18px; border-radius:999px; cursor:pointer; text-decoration:none; font-family:inherit; }
    .back-btn:hover { background:rgba(255,255,255,0.25); }
    .hamburger { position:absolute; top:20px; right:20px; z-index:10; background:rgba(255,255,255,0.15); border:1.5px solid rgba(255,255,255,0.3); border-radius:10px; width:40px; height:40px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer; padding:0; }
    .hamburger span { display:block; width:18px; height:2px; background:#fff; border-radius:999px; transition:all 0.3s; }
    .hamburger.open span:nth-child(1) { transform:translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity:0; }
    .hamburger.open span:nth-child(3) { transform:translateY(-7px) rotate(-45deg); }
    header h1 { font-family:'Playfair Display',serif; font-size:clamp(1.8rem,5vw,2.8rem); font-weight:800; color:#fff; position:relative; z-index:1; }
    header h1 span { color:var(--accent); font-style:italic; }
    .header-sub { color:rgba(255,255,255,0.75); font-size:0.95rem; margin-top:8px; position:relative; z-index:1; }
    .wave { display:block; width:100%; margin-top:-2px; }

    main { max-width:960px; margin:0 auto; padding:28px 20px 80px; }

    /* FILTERS */
    .filters { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; align-items:center; }
    .filter-label { font-size:0.78rem; font-weight:700; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.05em; }
    .filter-select { padding:10px 16px; border:1.5px solid var(--border); border-radius:12px; font-family:'IBM Plex Sans',sans-serif; font-size:0.9rem; color:var(--text-dark); background:var(--white); outline:none; cursor:pointer; }
    .filter-select:focus { border-color:var(--purple-light); }

    /* SUMMARY BAR */
    .summary-bar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:24px; }
    .summary-card { background:var(--white); border:1.5px solid var(--border); border-radius:14px; padding:14px 20px; flex:1; min-width:120px; text-align:center; }
    .summary-card.green { background:linear-gradient(135deg,#D1FAE5,#A7F3D0); border-color:#6EE7B7; }
    .summary-card.red   { background:linear-gradient(135deg,#FEE2E2,#FECACA); border-color:#FCA5A5; }
    .summary-num { font-family:'Playfair Display',serif; font-size:2rem; font-weight:800; color:var(--text-dark); }
    .summary-card.green .summary-num { color:#065F46; }
    .summary-card.red   .summary-num { color:#991B1B; }
    .summary-lbl { font-size:0.72rem; font-weight:700; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:0.05em; margin-top:4px; }

    /* TABLE */
    .table-wrap { background:var(--white); border:1.5px solid var(--border); border-radius:20px; overflow:hidden; overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:360px; }
    thead th { background:linear-gradient(135deg,var(--purple),#5B21B6); color:#fff; padding:12px 16px; font-size:0.78rem; font-family:'IBM Plex Mono',monospace; font-weight:600; letter-spacing:0.04em; text-align:left; }
    thead th:nth-last-child(-n+2) { text-align:center; }
    tbody tr { border-bottom:1px solid var(--border); transition:background 0.12s; }
    tbody tr:last-child { border-bottom:none; }
    tbody tr:hover { background:var(--off-white); }
    tbody td { padding:11px 16px; font-size:0.9rem; }
    tbody td:nth-last-child(-n+2) { text-align:center; }
    .student-no { font-size:0.72rem; color:var(--text-muted); font-family:'IBM Plex Mono',monospace; margin-right:6px; }
    .badge-submitted { display:inline-flex; align-items:center; gap:5px; background:#D1FAE5; color:#065F46; border:1.5px solid #6EE7B7; border-radius:999px; padding:4px 12px; font-size:0.78rem; font-weight:700; font-family:'IBM Plex Mono',monospace; }
    .badge-missing   { display:inline-flex; align-items:center; gap:5px; background:#FEE2E2; color:#991B1B; border:1.5px solid #FCA5A5; border-radius:999px; padding:4px 12px; font-size:0.78rem; font-weight:700; font-family:'IBM Plex Mono',monospace; }

    /* STATE */
    .state-card { text-align:center; padding:60px 20px; }
    .state-icon { font-size:2.5rem; margin-bottom:12px; }
    .state-title { font-family:'Playfair Display',serif; font-size:1.1rem; font-weight:700; margin-bottom:6px; }
    .state-sub { font-size:0.85rem; color:var(--text-muted); }
    .spinner { width:36px; height:36px; border:3px solid var(--border); border-top-color:var(--purple); border-radius:50%; animation:spin 0.8s linear infinite; margin:0 auto 16px; }
    @keyframes spin { to { transform:rotate(360deg); } }

    footer { background:var(--text-dark); color:rgba(255,255,255,0.5); text-align:center; padding:20px; font-size:0.85rem; }
    footer strong { color:var(--purple-light); }

    /* SIDEBAR */
    .sidebar-overlay { position:fixed; inset:0; background:rgba(15,10,40,0.6); backdrop-filter:blur(6px); z-index:300; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .sidebar-overlay.open { opacity:1; pointer-events:all; }
    .sidebar { position:fixed; top:0; right:0; height:100%; width:min(320px,85vw); background:#1E1040; z-index:301; transform:translateX(100%); transition:transform 0.35s cubic-bezier(0.34,1.1,0.64,1); display:flex; flex-direction:column; overflow-y:auto; }
    .sidebar.open { transform:translateX(0); }
    .sidebar-head { padding:24px 20px 16px; border-bottom:1px solid rgba(255,255,255,0.08); display:flex; align-items:center; gap:12px; }
    .sidebar-logo { width:36px; height:36px; border-radius:10px; object-fit:cover; }
    .sidebar-head-text { flex:1; }
    .sidebar-head-title { font-family:'Playfair Display',serif; font-size:1rem; font-weight:800; color:#fff; }
    .sidebar-head-sub { font-size:0.7rem; color:rgba(255,255,255,0.45); margin-top:1px; }
    .sidebar-close { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,0.08); border:none; color:rgba(255,255,255,0.5); cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; }
    .sidebar-section { padding:14px 16px 4px; }
    .sidebar-section-label { font-size:0.65rem; font-weight:700; color:rgba(255,255,255,0.3); text-transform:uppercase; letter-spacing:0.12em; font-family:'IBM Plex Mono',monospace; padding:0 4px; margin-bottom:6px; }
    .sidebar-item { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; text-decoration:none; transition:background 0.15s; margin-bottom:2px; }
    .sidebar-item:hover { background:rgba(255,255,255,0.08); }
    .sidebar-item.active { background:rgba(255,255,255,0.12); border-left:3px solid #A78BFA; padding-left:9px; }
    .sidebar-item-icon { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:0.95rem; flex-shrink:0; }
    .sidebar-item-name { font-size:0.88rem; font-weight:600; color:#fff; flex:1; }
    .sidebar-item-badge { font-size:0.6rem; font-weight:800; padding:2px 7px; border-radius:999px; font-family:'IBM Plex Mono',monospace; background:#F59E0B; color:#fff; }
    .sidebar-divider { height:1px; background:rgba(255,255,255,0.07); margin:8px 16px; }
    .sidebar-teacher { margin:12px 16px 20px; background:rgba(124,58,237,0.2); border:1px solid rgba(124,58,237,0.35); border-radius:14px; padding:12px 14px; }
    .sidebar-teacher-label { font-size:0.68rem; font-weight:700; color:#A78BFA; text-transform:uppercase; letter-spacing:0.08em; font-family:'IBM Plex Mono',monospace; margin-bottom:8px; }
    .sidebar-teacher-logged { font-size:0.82rem; color:#A78BFA; font-weight:600; display:flex; align-items:center; gap:8px; }
    .sidebar-teacher-logged span { cursor:pointer; color:rgba(255,255,255,0.4); font-size:0.75rem; margin-left:auto; }
    .sidebar-home-btn { display:flex; align-items:center; gap:10px; margin:12px 16px 4px; padding:11px 14px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:12px; text-decoration:none; }
    .sidebar-home-btn:hover { background:rgba(255,255,255,0.1); }
    .sidebar-home-btn-text { font-size:0.85rem; font-weight:700; color:#fff; }
    .sidebar-home-btn-sub { font-size:0.7rem; color:rgba(255,255,255,0.4); }
  </style>
  <script src="sidebar.js"></script>
  <script src="security-lock.js?v=20260522"></script>
</head>
<body data-page="submission_status">

<header>
  <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
  <a class="back-btn" href="index.html">&#8592; Back</a>
  <h1>Submission <span>Status</span></h1>
  <p class="header-sub">Chapters 4 &amp; 5 &middot; English Quest &middot; SMA Negeri 6 Surakarta</p>
</header>
<svg class="wave" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 48" preserveAspectRatio="none">
  <path fill="#4C1D95" d="M0,32 C360,0 1080,64 1440,32 L1440,0 L0,0 Z"/>
  <path fill="#F9F7FF" d="M0,48 C360,16 1080,64 1440,32 L1440,48 Z"/>
</svg>

<main>
  <div class="filters">
    <span class="filter-label">Class</span>
    <select class="filter-select" id="classSelect" onchange="renderTable()">
      <option value="all">All Classes</option>
    </select>
    <select class="filter-select" id="statusFilter" onchange="renderTable()">
      <option value="all">All Students</option>
      <option value="ch4submitted">Ch4 Submitted</option>
      <option value="ch4missing">Ch4 Not Submitted</option>
      <option value="ch5submitted">Ch5 Submitted</option>
      <option value="ch5missing">Ch5 Not Submitted</option>
    </select>
  </div>

  <div class="summary-bar" id="summaryBar"></div>
  <div id="tableArea">
    <div class="state-card"><div class="spinner"></div><div class="state-title">Loading submissions...</div></div>
  </div>
</main>

<footer>© 2026 <strong>English Quest</strong> · SMA Negeri 6 Surakarta · Built with ❤️ by <strong>LaksMedia</strong></footer>

<script>
const SCORES_API = 'https://script.google.com/macros/s/AKfycbxBTC4vnFB3A73QwThdRxrUruvUNZRlpwwLFBjt5C0cJGIh8wz461ZCn3b9Y6wWPpyAGg/exec';
const CLASS_LABELS = { XE1:'X E-1', XE4:'X E-4', XE5:'X E-5', XE6:'X E-6', XE7:'X E-7', XE8:'X E-8', XE9:'X E-9', XE10:'X E-10', XE11:'X E-11' };

var allData  = null; // Ch4: { classes, students: { ClassName: [{name, submitted}] } }
var ch5Data  = null; // Ch5: { byKey: { 'normcls|normname': { tasks: [bool x5] } } }

function normCls(s)  { return String(s).toLowerCase().replace(/[^a-z0-9]/g, ''); }
function normName(s) { return String(s).toLowerCase().replace(/[-]/g, ' ').replace(/[^a-z0-9\s]/g, '').replace(/\s+/g, ' ').trim(); }

function ch5Key(cls, name) { return normCls(cls) + '|' + normName(name); }

function getCh5Entry(cls, name) {
  if (!ch5Data || !ch5Data.byKey) return null;
  return ch5Data.byKey[ch5Key(cls, name)] || null;
}

function apiGet(params) {
  var url = SCORES_API + '?';
  var parts = [];
  for (var k in params) parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  url += parts.join('&');
  return new Promise(function(resolve, reject) {
    var cb = 'cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
    var s  = document.createElement('script');
    var timer = setTimeout(function() {
      delete window[cb];
      try { if (s.parentNode) s.parentNode.removeChild(s); } catch(e) {}
      reject(new Error('Request timed out.'));
    }, 20000);
    window[cb] = function(data) {
      clearTimeout(timer); delete window[cb];
      try { if (s.parentNode) s.parentNode.removeChild(s); } catch(e) {}
      resolve(data);
    };
    s.onerror = function() { clearTimeout(timer); delete window[cb]; reject(new Error('Network error.')); };
    s.src = url + '&callback=' + cb;
    document.head.appendChild(s);
  });
}

function load() {
  document.getElementById('tableArea').innerHTML = '<div class="state-card"><div class="spinner"></div><div class="state-title">Loading submissions...</div></div>';
  Promise.all([
    apiGet({ action: 'getSubmissions' }),
    apiGet({ action: 'getCh5Submissions' })
  ]).then(function(results) {
    var ch4Res = results[0], ch5Res = results[1];
    if (ch4Res.error) {
      document.getElementById('tableArea').innerHTML = '<div class="state-card"><div class="state-icon">&#128580;</div><div class="state-title">Error</div><div class="state-sub">' + ch4Res.error + '</div></div>';
      return;
    }
    allData = ch4Res;
    ch5Data = ch5Res;
    var sel = document.getElementById('classSelect');
    (ch4Res.classes || []).forEach(function(cls) {
      var opt = document.createElement('option');
      opt.value = cls;
      opt.textContent = CLASS_LABELS[cls] || cls;
      sel.appendChild(opt);
    });
    var savedCls = localStorage.getItem('eq_student_class');
    if (savedCls && ch4Res.classes && ch4Res.classes.includes(savedCls)) sel.value = savedCls;
    renderTable();
  }).catch(function(e) {
    document.getElementById('tableArea').innerHTML = '<div class="state-card"><div class="state-icon">&#9203;</div><div class="state-title">Could not connect</div><div class="state-sub">' + e.message + '</div></div>';
  });
}

function renderTable() {
  if (!allData) return;
  var cls    = document.getElementById('classSelect').value;
  var filter = document.getElementById('statusFilter').value;

  var rows = [];
  if (cls === 'all') {
    (allData.classes || []).forEach(function(c) {
      (allData.students[c] || []).forEach(function(s) {
        rows.push({ cls: c, name: s.name, ch4: s.submitted, ch5: getCh5Entry(c, s.name) });
      });
    });
  } else {
    (allData.students[cls] || []).forEach(function(s) {
      rows.push({ cls: cls, name: s.name, ch4: s.submitted, ch5: getCh5Entry(cls, s.name) });
    });
  }

  if (filter === 'ch4submitted') rows = rows.filter(function(r) { return r.ch4; });
  if (filter === 'ch4missing')   rows = rows.filter(function(r) { return !r.ch4; });
  if (filter === 'ch5submitted') rows = rows.filter(function(r) { return !!r.ch5; });
  if (filter === 'ch5missing')   rows = rows.filter(function(r) { return !r.ch5; });

  var total      = rows.length;
  var ch4done    = rows.filter(function(r) { return r.ch4; }).length;
  var ch5done    = rows.filter(function(r) { return !!r.ch5; }).length;
  var ch4pct     = total ? Math.round((ch4done / total) * 100) : 0;
  var ch5pct     = total ? Math.round((ch5done / total) * 100) : 0;

  document.getElementById('summaryBar').innerHTML =
    '<div class="summary-card"><div class="summary-num">' + total + '</div><div class="summary-lbl">Total Students</div></div>' +
    '<div class="summary-card green"><div class="summary-num">' + ch4done + '</div><div class="summary-lbl">Ch4 Submitted</div></div>' +
    '<div class="summary-card" style="background:linear-gradient(135deg,#DBEAFE,#BFDBFE);border-color:#93C5FD"><div class="summary-num" style="color:#1E40AF">' + ch5done + '</div><div class="summary-lbl">Ch5 Submitted</div></div>' +
    '<div class="summary-card red"><div class="summary-num">' + (total - ch4done) + '</div><div class="summary-lbl">Ch4 Missing</div></div>';

  if (!rows.length) {
    document.getElementById('tableArea').innerHTML = '<div class="state-card"><div class="state-icon">&#128203;</div><div class="state-title">No students found</div><div class="state-sub">Try changing the filter.</div></div>';
    return;
  }

  var showClass = cls === 'all';
  var thead = '<thead><tr><th>#</th>' + (showClass ? '<th>Class</th>' : '') + '<th>Student Name</th><th style="text-align:center">Ch4</th><th style="text-align:center">Ch5 Tasks</th></tr></thead>';
  var tbody = '<tbody>';
  rows.forEach(function(r, i) {
    var ch5chips = '—';
    if (r.ch5) {
      ch5chips = r.ch5.tasks.map(function(done, ti) {
        return '<span style="display:inline-block;padding:1px 7px;border-radius:999px;font-size:0.68rem;font-weight:700;font-family:IBM Plex Mono,monospace;margin:1px;' +
          (done ? 'background:#D1FAE5;color:#065F46;border:1px solid #6EE7B7' : 'background:#F3F4F6;color:#9CA3AF;border:1px solid #E5E7EB') +
          '">T' + (ti + 1) + '</span>';
      }).join('');
    }
    tbody += '<tr>';
    tbody += '<td><span class="student-no">' + (i + 1) + '</span></td>';
    if (showClass) tbody += '<td><span style="font-size:0.8rem;font-weight:700;font-family:IBM Plex Mono,monospace;color:var(--purple)">' + (CLASS_LABELS[r.cls] || r.cls) + '</span></td>';
    tbody += '<td>' + r.name + '</td>';
    tbody += '<td style="text-align:center">' + (r.ch4
      ? '<span class="badge-submitted">&#10003; Done</span>'
      : '<span class="badge-missing">&#10005; No</span>') + '</td>';
    tbody += '<td style="text-align:center;white-space:nowrap">' + ch5chips + '</td>';
    tbody += '</tr>';
  });
  tbody += '</tbody>';

  document.getElementById('tableArea').innerHTML = '<div class="table-wrap"><table>' + thead + tbody + '</table></div>';
}

load();
</script>
</body>
</html>
