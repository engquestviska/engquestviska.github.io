<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Submission · English Quest</title>
  <link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../shared/css/system.css?v=20260702"/>
  <link rel="stylesheet" href="../shared/css/app-shell.css?v=20261110"/>
  <style>
    main { max-width: 900px; margin: 0 auto; padding: 26px 20px 80px; }
    .sub-need-login { text-align:center; padding:56px 20px; color:#64748b; background:#fff; border:1px solid #e5ecf6; border-radius:20px; }
    .sub-need-login a { color:var(--blue); font-weight:700; }
    .sub-intro { color:#64748b; font-size:.9rem; margin:2px 0 20px; line-height:1.55; }
    .chapter-card { background:#fff; border:1px solid #e5ecf6; border-radius:20px; padding:20px 22px; box-shadow:0 16px 40px rgba(15,23,42,.05); margin-bottom:18px; }
    .chapter-card h2 { font-family:'Playfair Display',serif; font-size:1.25rem; font-weight:800; margin-bottom:14px; }
    .task-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid #f1f5f9; }
    .task-row:first-of-type { border-top:none; }
    .task-name { font-weight:700; font-size:.95rem; min-width:88px; }
    .task-status { flex:1; }
    .pill { display:inline-flex; align-items:center; gap:6px; font-size: 0.75rem; font-weight:700; padding:4px 11px; border-radius:999px; font-family:'IBM Plex Mono',monospace; }
    .pill.none { background:#f1f5f9; color:#64748b; }
    .pill.pending { background:#fef3c7; color:#b45309; }
    .pill.approved { background:#dcfce7; color:#15803d; }
    .pill.rejected { background:#fee2e2; color:#b91c1c; }
    .pill.score { background:#eff6ff; color:#1d4ed8; }
    .pill.noscore { background:#f8fafc; color:#94a3b8; }
    .task-status { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
    .task-actions { display:flex; gap:8px; align-items:center; }
    .see-btn { border:1.5px solid #e2e8f0; background:#fff; color:#475569; border-radius:11px; padding:8px 12px; font:700 .8rem 'IBM Plex Sans',sans-serif; cursor:pointer; white-space:nowrap; }
    .see-btn[aria-expanded="true"] { background:#f1f5f9; }
    .my-photos { display:flex; flex-wrap:wrap; gap:10px; padding:4px 0 12px; }
    .my-photo { width:92px; }
    .my-photo .box { width:92px; height:92px; border-radius:12px; overflow:hidden; border:1px solid #e5ecf6; background:#f8fafc; display:grid; place-items:center; font-size: 0.75rem; color:#94a3b8; cursor:pointer; }
    .my-photo img { width:100%; height:100%; object-fit:cover; }
    .my-photo .cap { font-size: 0.75rem; font-weight:700; margin-top:4px; text-align:center; }
    .cap.pending { color:#b45309; } .cap.approved { color:#15803d; } .cap.rejected { color:#b91c1c; }
    .rm-photo { display:block; width:100%; margin-top:4px; border:1.5px solid #fecdd3; background:#fff1f2; color:#be123c; border-radius:9px; padding:5px 0; font:700 .72rem 'IBM Plex Sans',sans-serif; cursor:pointer; }
    .rm-photo:disabled { opacity:.5; cursor:not-allowed; }
    .lightbox { position:fixed; inset:0; background:rgba(15,23,42,.85); display:none; align-items:center; justify-content:center; padding:20px; z-index:70; }
    .lightbox.on { display:flex; }
    .lightbox img { max-width:100%; max-height:90vh; border-radius:12px; }
    @media (max-width:560px) {
      .task-row { flex-wrap:wrap; }
      .task-status { flex-basis:calc(100% - 100px); }
      .task-actions { width:100%; justify-content:flex-end; }
    }
    .task-btn { border:none; border-radius:11px; padding:9px 16px; font:700 .84rem 'IBM Plex Sans',sans-serif; cursor:pointer; background:var(--blue); color:#fff; white-space:nowrap; }
    .task-btn.resubmit { background:#fff; color:var(--blue); border:1.5px solid var(--blue); }
    /* Preview modal */
    .modal-back { position:fixed; inset:0; background:rgba(15,23,42,.62); display:none; align-items:center; justify-content:center; padding:20px; z-index:60; }
    .modal-back.on { display:flex; }
    .modal { background:#fff; border-radius:22px; padding:22px; max-width:420px; width:100%; box-shadow:0 30px 80px rgba(15,23,42,.3); }
    .modal h3 { font-family:'Playfair Display',serif; font-size:1.2rem; font-weight:800; margin-bottom:4px; }
    .modal .msub { color:#64748b; font-size:.84rem; margin-bottom:14px; }
    .thumb-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:8px; }
    .thumb { position:relative; aspect-ratio:1; border-radius:12px; overflow:hidden; border:1px solid #e5ecf6; background:#f8fafc; }
    .thumb img { width:100%; height:100%; object-fit:cover; }
    .thumb .rm { position:absolute; top:4px; right:4px; width:22px; height:22px; border:none; border-radius:50%; background:rgba(15,23,42,.72); color:#fff; font-weight:800; cursor:pointer; line-height:20px; padding:0; }
    .add-photo { width:100%; border:1.5px dashed var(--blue); background:#fff; color:var(--blue); border-radius:12px; padding:12px; font:700 .9rem 'IBM Plex Sans',sans-serif; cursor:pointer; }
    .add-photo:disabled { opacity:.5; cursor:not-allowed; }
    .add-row { display:flex; gap:8px; }
    .add-row .add-photo { flex:1; padding:12px 8px; }
    .add-note { font-size: 0.75rem; color:#64748b; text-align:center; margin-top:6px; }
    .modal-actions { display:flex; gap:10px; margin-top:16px; }
    .modal-actions button { flex:1; border-radius:12px; padding:12px; font:700 .9rem 'IBM Plex Sans',sans-serif; cursor:pointer; border:none; }
    .btn-cancel { background:#f1f5f9; color:#475569; }
    .btn-send { background:var(--blue); color:#fff; }
    .btn-send:disabled { opacity:.55; cursor:not-allowed; }
    .modal-msg { margin-top:10px; font-size:.84rem; font-weight:600; min-height:1em; text-align:center; }
    .modal-msg.err { color:#dc2626; } .modal-msg.ok { color:#059669; }
  </style>
  <script src="../shared/js/classes-20260617.js?v=20260712"></script>
  <script src="../shared/js/student.js?v=20261115"></script>
  <script src="../shared/js/api.js?v=20261116"></script>
  <script src="../shared/js/sidebar.js?v=20261110"></script>
  <link rel="stylesheet" href="../shared/css/student-shell.css?v=20261118"/>
</head>
<body class="grade11-subpage grade11-page" data-page="submission">
  <header class="subpage-header">
    <div class="topbar">
      <div class="brand">
        <img src="../logo.jpg" alt="English Quest Logo"/>
        <div>
          <div class="brand-title">English Quest</div>
          <div class="brand-sub">Grade 11 Student Track</div>
        </div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <a href="index.html">Grade 11 Home</a>
        <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
      </nav>
    </div>
    <section class="subpage-hero">
      <div class="kicker">Submit Task</div>
      <h1>Submission</h1>
      <p class="hero-copy">Send photos of your finished work, up to 10 for each task.</p>
    </section>
  </header>

  <main>
    <p class="sub-intro" id="subSummary" style="display:none" aria-live="polite">Loading your tasks…</p>
    <div id="chapters"></div>
    <div class="sub-need-login" id="needLogin" style="display:none">Log in on the <a href="index.html">homepage</a> first to submit your tasks.</div>
  </main>

  <div class="modal-back" id="modalBack">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Submit photos</h3>
      <div class="msub" id="modalSub"></div>
      <div class="modal-warn" id="modalWarn" hidden></div>
      <div class="thumb-grid" id="thumbGrid"></div>
      <div class="add-row">
        <button class="add-photo" id="btnCamera" type="button">Take photo</button>
        <button class="add-photo" id="btnGallery" type="button">From gallery</button>
      </div>
      <div class="add-note" id="addNote"></div>
      <div class="modal-msg" id="modalMsg"></div>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancel" type="button">Cancel</button>
        <button class="btn-send" id="btnSend" type="button">Send</button>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('on')"><button class="lightbox-close" type="button">Close</button><img id="lightboxImg" alt="Your submitted photo"/></div>

  <input type="file" id="fileInput" accept="image/*" multiple style="display:none"/>
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none"/>

  <script>
    var GRADE = '11';
    var STUDENT = null;      // { classId, studentNo }
    var pendingKey = null;   // task key being submitted
    var pendingImages = [];  // array of base64 strings (no prefix)
    var MAX_PHOTOS = 10;
    var UNIT_NAMES = ['Narrative Text', 'Analytical & Hortatory Exposition Text'];
    function unitTitle(ch) { return 'Chapter ' + ch + (UNIT_NAMES[ch - 1] ? ' · ' + UNIT_NAMES[ch - 1] : ''); }

    var CHAPTER_COUNT = 3;
    // Chapter n's scores are stored as backend chapter n+3 (same as the Scores page).
    var SCORE_CHAPTER_OFFSET = 3;

    // The backend stores an approved photo as 'approved' (older rows said 'reviewed').
    function normStatus(st) { return (st === 'approved' || st === 'reviewed') ? 'approved' : (st || ''); }

    function statusPill(st) {
      if (st === 'pending')  return '<span class="pill pending">Waiting for teacher</span>';
      if (st === 'approved') return '<span class="pill approved">Approved</span>';
      if (st === 'rejected') return '<span class="pill rejected">Sent back</span>';
      return '<span class="pill none">Not sent</span>';
    }

    function scorePill(st, score) {
      // A 0 in the grid means "not submitted yet", so it is not shown as a score.
      if (score !== '' && score !== undefined && score !== null && Number(score) !== 0) return '<span class="pill score">Score: ' + escapeHtml(score) + '</span>';
      if (st === 'approved') return '<span class="pill noscore">Score not entered yet</span>';
      return '';
    }

    function escapeHtml(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

    function taskStatus(ch, t) { return normStatus(lastStatuses['C' + ch + 'T' + t]); }

    function photoCount(n) { return n + (n === 1 ? ' photo' : ' photos'); }

    function actionButton(key, st) {
      if (st === 'approved') return '';
      if (st === 'pending') return '<button class="task-btn resubmit" type="button" onclick="pickFile(\'' + key + '\')">Replace</button>';
      return '<button class="task-btn" type="button" onclick="pickFile(\'' + key + '\')">' + (st ? 'Resubmit' : 'Submit') + '</button>';
    }

    function taskRow(ch, t) {
      var key = 'C' + ch + 'T' + t;
      var st = taskStatus(ch, t);
      var score = (lastScores[ch] || {})['Task ' + t];
      var photos = myItems.filter(function(i){ return i.task === key; });
      var see = photos.length
        ? '<button class="see-btn" type="button" aria-expanded="' + (openTask === key) + '" onclick="togglePhotos(\'' + key + '\')">' + photoCount(photos.length) + '</button>'
        : '';
      var row = '<div class="task-row">' +
        '<span class="task-name">Task ' + t + '</span>' +
        '<span class="task-status">' + statusPill(st) + scorePill(st, score) + '</span>' +
        '<span class="task-actions">' + see + actionButton(key, st) + '</span>' +
      '</div>';
      if (openTask !== key) return row;
      row += '<div class="my-photos">' + photos.map(photoHtml).join('') + '</div>';
      if (st === 'approved') row += '<div class="approved-note"><span>Need to send new photos? This deletes your approved photos, and your teacher has to check again.</span>' +
        '<button class="replace-link" type="button" onclick="pickFile(\'' + key + '\')">Send new photos</button></div>';
      return row;
    }

    function chapterSummary(ch) {
      var approved = 0;
      for (var t = 1; t <= 3; t++) if (taskStatus(ch, t) === 'approved') approved++;
      return approved === 3 ? 'All approved' : approved + ' of 3 approved';
    }

    // Finished chapters fold away, so the work still to do comes first.
    function chapterIsOpen(ch) {
      if (chapterOpen[ch] !== undefined) return chapterOpen[ch];
      return chapterSummary(ch) !== 'All approved';
    }

    function renderSummary() {
      var counts = { approved: 0, pending: 0, todo: 0 };
      for (var ch = 1; ch <= CHAPTER_COUNT; ch++) for (var t = 1; t <= 3; t++) {
        var st = taskStatus(ch, t);
        if (st === 'approved') counts.approved++;
        else if (st === 'pending') counts.pending++;
        else counts.todo++;
      }
      var line = document.getElementById('subSummary');
      line.textContent = counts.approved + ' approved · ' + counts.pending + ' waiting · ' + counts.todo + ' not sent';
    }

    function render() {
      if (!statusesLoaded) return;
      renderSummary();
      var wrap = document.getElementById('chapters');
      var html = '';
      for (var ch = 1; ch <= CHAPTER_COUNT; ch++) {
        html += '<details class="chapter-card" data-ch="' + ch + '"' + (chapterIsOpen(ch) ? ' open' : '') + '>' +
          '<summary><h2>' + escapeHtml(unitTitle(ch)) + '</h2><span class="chapter-count">' + chapterSummary(ch) + '</span></summary>';
        for (var t = 1; t <= 3; t++) html += taskRow(ch, t);
        html += '</details>';
      }
      wrap.innerHTML = html;
      wrap.querySelectorAll('details').forEach(function(card) {
        card.addEventListener('toggle', function() { chapterOpen[card.getAttribute('data-ch')] = card.open; });
      });
      if (openTask) loadPhotos(openTask);
    }

    function showLoadError() {
      document.getElementById('subSummary').textContent = 'We could not load your tasks.';
      document.getElementById('chapters').innerHTML = '<div class="sub-need-login">Check your connection, then try again.<br/>' +
        '<button class="task-btn sub-retry" type="button" onclick="loadStatuses()">Try again</button></div>';
    }

    var lastStatuses = {};
    var myItems = [];        // every photo this student sent: {id, task, status, date}
    var lastScores = {};     // chapter (1..3) -> {'Task 1': 90, ...}
    var openTask = null;     // task whose photos are showing
    var statusesLoaded = false;
    var chapterOpen = {};    // chapter -> open or closed, once the student has chosen
    var PHOTO_CACHE = {};    // id -> data URL
    var PHOTO_LOADING = {};  // id -> true while its request is in flight

    function photoHtml(i) {
      var st = normStatus(i.status);
      var cap = st === 'approved' ? 'Approved' : st === 'rejected' ? 'Sent back' : 'Waiting';
      return '<div class="my-photo"><div class="box" id="myph-' + i.id + '" onclick="showBig(' + i.id + ')">Loading…</div>' +
        '<div class="cap ' + st + '">' + cap + '</div>' +
        // Approved photos are graded work, so only unapproved ones can be removed.
        (st === 'approved' ? '' : '<button class="rm-photo" type="button" onclick="askRemovePhoto(' + i.id + ', this)">Remove</button>') +
        '</div>';
    }

    function askRemovePhoto(id, btn) {
      EQStudentShell.confirmTap(btn, function() { removePhoto(id, btn); }, 'Tap again');
    }

    function removePhoto(id, btn) {
      btn.disabled = true; btn.textContent = 'Removing…';
      EQApi.get({ action: 'deleteMySubmission', className: STUDENT.classId, studentNo: STUDENT.studentNo, id: id }).then(function(res) {
        if (!res || !res.success) {
          alert(res && res.error === 'Already approved' ? 'Your teacher already approved this photo, so it cannot be removed.' : 'Could not remove the photo. Please try again.');
          loadStatuses();
          return;
        }
        delete PHOTO_CACHE[id];
        loadStatuses();
      }).catch(function() { btn.disabled = false; btn.textContent = 'Remove'; alert('Network error. Please try again.'); });
    }

    function togglePhotos(key) { openTask = openTask === key ? null : key; render(); }

    function setPhoto(id) {
      var box = document.getElementById('myph-' + id);
      if (box && PHOTO_CACHE[id]) box.innerHTML = '<img src="' + PHOTO_CACHE[id] + '" alt="Your photo"/>';
    }

    function loadPhotos(key) {
      myItems.filter(function(i){ return i.task === key; }).forEach(function(i) {
        if (PHOTO_CACHE[i.id]) return setPhoto(i.id);
        if (PHOTO_LOADING[i.id]) return;
        PHOTO_LOADING[i.id] = true;
        EQApi.get({ action: 'getMyPhoto', className: STUDENT.classId, studentNo: STUDENT.studentNo, id: i.id }).then(function(res) {
          if (res && res.success && res.dataBase64) {
            PHOTO_CACHE[i.id] = 'data:' + (res.mimeType || 'image/jpeg') + ';base64,' + res.dataBase64;
            setPhoto(i.id);
          } else {
            delete PHOTO_LOADING[i.id];
            var box = document.getElementById('myph-' + i.id); if (box) box.textContent = 'Not available';
          }
        }).catch(function() {
          delete PHOTO_LOADING[i.id];
          var box = document.getElementById('myph-' + i.id); if (box) box.textContent = 'Network error';
        });
      });
    }

    function showBig(id) {
      if (!PHOTO_CACHE[id]) return;
      document.getElementById('lightboxImg').src = PHOTO_CACHE[id];
      document.getElementById('lightbox').classList.add('on');
    }

    function applySubmissions(res) {
      lastStatuses = (res && res.statuses) || {};
      myItems = (res && res.items) || [];
    }

    function loadStatuses() {
      if (!window.EQApi || !STUDENT) return;
      EQApi.get({ action: 'getMySubmissions', className: STUDENT.classId, studentNo: STUDENT.studentNo })
        .then(function(res) { statusesLoaded = true; applySubmissions(res); render(); })
        .catch(function() { if (!statusesLoaded) showLoadError(); });
    }

    function loadScores() {
      if (!window.EQApi || !STUDENT) return;
      for (var ch = 1; ch <= CHAPTER_COUNT; ch++) (function(ch) {
        EQApi.get({ action: 'getChapterScores', className: STUDENT.classId, chapter: ch + SCORE_CHAPTER_OFFSET }).then(function(res) {
          var me = res && res.students ? res.students.find(function(s) { return String(s.no) === String(STUDENT.studentNo); }) : null;
          lastScores[ch] = (me && me.scores) || {};
          render();
        }).catch(function() {});
      })(ch);
    }

    // Unit names are set by the teacher (Materials page); the list above is a fallback.
    function loadUnitNames() {
      if (!window.EQApi) return;
      EQApi.get({ action: 'getUnitNames', grade: GRADE }).then(function(res) {
        if (res && res.names && res.names.length) { UNIT_NAMES = res.names; render(); }
      }).catch(function() {});
    }

    function pickFile(key) {
      pendingKey = key;
      pendingImages = [];
      var parts = key.match(/C(\d)T(\d)/);
      document.getElementById('modalTitle').textContent = 'Chapter ' + parts[1] + ' · Task ' + parts[2];
      document.getElementById('modalSub').textContent = 'Add clear photos of your work. You can send up to ' + MAX_PHOTOS + '.';
      var warn = document.getElementById('modalWarn');
      var st = normStatus(lastStatuses[key]);
      warn.hidden = !st;
      warn.textContent = st === 'approved'
        ? 'Your approved photos will be deleted, and your teacher will have to check this task again.'
        : 'These photos will replace the ones you sent before.';
      var msg = document.getElementById('modalMsg'); msg.textContent = ''; msg.className = 'modal-msg';
      renderThumbs();
      document.getElementById('modalBack').classList.add('on');
    }

    // Camera takes one photo per tap; the gallery lets students tick many at once.
    function openPicker(id) {
      var fi = document.getElementById(id);
      fi.value = '';
      fi.click();
    }
    document.getElementById('btnCamera').onclick = function() { openPicker('cameraInput'); };
    document.getElementById('btnGallery').onclick = function() { openPicker('fileInput'); };

    function renderThumbs() {
      var grid = document.getElementById('thumbGrid');
      grid.innerHTML = pendingImages.map(function(b64, i) {
        return '<div class="thumb"><img alt="Photo ' + (i + 1) + '" src="data:image/jpeg;base64,' + b64 + '"/>' +
               '<button class="rm" type="button" aria-label="Remove photo ' + (i + 1) + '" onclick="removeThumb(' + i + ')">×</button></div>';
      }).join('');
      var send = document.getElementById('btnSend');
      send.disabled = pendingImages.length === 0;
      send.textContent = pendingImages.length ? 'Send ' + photoCount(pendingImages.length) : 'Send';
      var full = pendingImages.length >= MAX_PHOTOS;
      document.getElementById('btnCamera').disabled = full;
      document.getElementById('btnGallery').disabled = full;
      document.getElementById('addNote').textContent = full ? 'Maximum ' + MAX_PHOTOS + ' photos' :
        (pendingImages.length ? pendingImages.length + '/' + MAX_PHOTOS + ' photos. You can add more.' : '');
    }

    function removeThumb(i) { pendingImages.splice(i, 1); renderThumbs(); }

    function compressImage(file, maxDim, quality) {
      return new Promise(function(resolve, reject) {
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function() {
          URL.revokeObjectURL(url);
          var w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function() { URL.revokeObjectURL(url); reject(new Error('Could not read image')); };
        img.src = url;
      });
    }

    function onPicked(e) {
      var files = Array.prototype.slice.call(e.target.files || []);
      if (!files.length) return;
      var msg = document.getElementById('modalMsg');
      msg.className = 'modal-msg'; msg.textContent = 'Processing…';
      var room = MAX_PHOTOS - pendingImages.length;
      var skipped = Math.max(files.length - room, 0);
      files = files.slice(0, room);
      // Smaller output: 1000px longest side, JPEG quality 0.5.
      Promise.all(files.map(function(f) { return compressImage(f, 1000, 0.5).then(function(d) { return d.split(',')[1]; }).catch(function() { return null; }); }))
        .then(function(results) {
          var unread = results.filter(function(b64) { return !b64; }).length;
          results.forEach(function(b64) { if (b64 && pendingImages.length < MAX_PHOTOS) pendingImages.push(b64); });
          var notes = [];
          if (skipped) notes.push(photoCount(skipped) + ' left out because the limit is ' + MAX_PHOTOS + '.');
          if (unread) notes.push(photoCount(unread) + ' could not be opened.');
          msg.className = notes.length ? 'modal-msg err' : 'modal-msg';
          msg.textContent = notes.join(' ');
          renderThumbs();
        });
    }
    document.getElementById('fileInput').addEventListener('change', onPicked);
    document.getElementById('cameraInput').addEventListener('change', onPicked);

    function closeModal() {
      document.getElementById('modalBack').classList.remove('on');
      pendingImages = [];
    }
    function setSending(on) {
      document.querySelector('.modal').classList.toggle('sending', on);
      document.getElementById('btnCancel').disabled = on;
      if (on) {
        document.getElementById('btnCamera').disabled = true;
        document.getElementById('btnGallery').disabled = true;
      }
    }

    document.getElementById('btnCancel').onclick = function() {
      if (!pendingImages.length) { closeModal(); return; }
      EQStudentShell.confirmTap(this, closeModal, 'Tap again');
    };
    document.addEventListener('keydown', function(event) {
      if (event.key !== 'Escape') return;
      document.getElementById('lightbox').classList.remove('on');
      if (!document.getElementById('btnCancel').disabled && !pendingImages.length) closeModal();
    });

    document.getElementById('btnSend').onclick = function() {
      if (!pendingImages.length || !STUDENT) return;
      var btn = document.getElementById('btnSend'), msg = document.getElementById('modalMsg');
      var key = pendingKey;
      var oldIds = myItems.filter(function(i) { return i.task === key; }).map(function(i) { return i.id; });
      function failed(text) {
        setSending(false);
        renderThumbs();
        msg.className = 'modal-msg err';
        msg.textContent = text;
      }
      // The upload takes longer with more photos, so check a few times.
      function confirmSaved(triesLeft) {
        return new Promise(function(r) { setTimeout(r, 2200); }).then(function() {
          return EQApi.get({ action: 'getMySubmissions', className: STUDENT.classId, studentNo: STUDENT.studentNo });
        }).then(function(res) {
          var arrived = ((res && res.items) || []).some(function(i) { return i.task === key && oldIds.indexOf(i.id) === -1; });
          if (arrived) return res;
          return triesLeft > 1 ? confirmSaved(triesLeft - 1) : null;
        });
      }
      btn.disabled = true;
      setSending(true);
      msg.className = 'modal-msg';
      msg.textContent = 'Sending ' + photoCount(pendingImages.length) + '. Please keep this page open…';
      EQApi.post({
        action: 'submitTaskPhoto',
        className: STUDENT.classId,
        studentNo: STUDENT.studentNo,
        taskKey: key,
        images: pendingImages,
        mimeType: 'image/jpeg'
      }).then(function() {
        return confirmSaved(4);
      }).then(function(res) {
        if (!res) { failed('Your photos did not arrive. Please try again.'); return; }
        msg.className = 'modal-msg ok';
        msg.textContent = 'Sent! Your teacher will check it soon.';
        applySubmissions(res);
        render();
        setTimeout(function() { setSending(false); closeModal(); }, 1200);
      }).catch(function() {
        failed('Could not send. Check your connection, then try again.');
      });
    };

    (function init() {
      var p = EQStudent.read(GRADE);
      if (p.hasProfile) {
        STUDENT = { classId: p.classId, studentNo: p.studentNo };
        document.getElementById('subSummary').style.display = '';
        loadUnitNames();
        loadStatuses();
        loadScores();
      } else {
        document.getElementById('needLogin').style.display = '';
      }
    })();
  </script>
</body>
</html>
