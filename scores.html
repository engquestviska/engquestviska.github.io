<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Final Score Dashboard · English Quest</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root {
      --ink:#07153B; --muted:#52617F; --line:#DBE4F4; --soft:#F6F9FF; --white:#FFF;
      --blue:#2563EB; --purple:#7C3AED; --green:#16A34A; --amber:#F59E0B; --red:#EF4444;
      --shadow:0 20px 50px rgba(37,99,235,.10);
    }
    body { margin:0; min-height:100vh; font-family:'IBM Plex Sans',sans-serif; color:var(--ink); background:linear-gradient(135deg,#F8FBFF 0%,#F7F2FF 100%); }
    .hamburger { position:fixed; top:20px; right:20px; z-index:20; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.35); border-radius:10px; width:42px; height:42px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer; }
    .hamburger span { width:19px; height:2px; background:#fff; border-radius:99px; }
    .hero { position:relative; overflow:hidden; padding:34px 20px 92px; color:#fff; background:linear-gradient(130deg,#0F5FD7 0%,#2563EB 42%,#6D28D9 100%); }
    .hero::before { content:""; position:absolute; inset:0; background-image:radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1px); background-size:30px 30px; opacity:.7; }
    .hero-inner { position:relative; max-width:1180px; margin:0 auto; text-align:center; }
    .topline { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:22px; }
    .logo { width:46px; height:46px; border-radius:12px; object-fit:cover; box-shadow:0 8px 20px rgba(0,0,0,.18); }
    .brand { text-align:left; line-height:1.05; }
    .brand-title { font-family:'Playfair Display',serif; font-size:1.25rem; font-weight:800; }
    .brand-sub { font-size:.78rem; opacity:.75; font-weight:700; }
    h1 { margin:0; font-family:'Playfair Display',serif; font-size:clamp(2.2rem,7vw,4.5rem); line-height:.98; letter-spacing:0; }
    .hero-copy { margin:14px auto 0; max-width:680px; color:rgba(255,255,255,.84); font-size:1rem; line-height:1.6; }
    .wave { display:block; width:100%; height:46px; margin-top:-45px; position:relative; z-index:2; }
    main { max-width:1180px; margin:-34px auto 0; padding:0 20px 80px; position:relative; z-index:3; }
    .panel { background:rgba(255,255,255,.92); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); }
    .picker { padding:22px; display:grid; grid-template-columns:1fr 1.6fr auto; gap:14px; align-items:end; }
    label { display:block; font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:800; color:#40527A; text-transform:uppercase; letter-spacing:.08em; margin:0 0 8px; }
    select { width:100%; min-height:48px; border:1px solid var(--line); background:#F9FBFF; border-radius:12px; padding:0 14px; color:var(--ink); font:600 .95rem 'IBM Plex Sans',sans-serif; outline:none; }
    select:focus { border-color:#93B4FF; box-shadow:0 0 0 4px rgba(37,99,235,.10); background:#fff; }
    button, .cta { min-height:48px; border:0; border-radius:12px; padding:0 22px; background:linear-gradient(135deg,var(--blue),var(--purple)); color:#fff; font:800 .94rem 'IBM Plex Sans',sans-serif; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
    button:disabled { opacity:.6; cursor:wait; }
    .state { padding:34px 22px; text-align:center; color:var(--muted); font-weight:700; }
    .spinner { width:34px; height:34px; border:3px solid #DCE7F8; border-top-color:var(--blue); border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .dashboard { display:none; margin-top:22px; }
    .student-head { padding:24px; display:flex; align-items:center; justify-content:space-between; gap:18px; margin-bottom:18px; }
    .identity { display:flex; align-items:center; gap:14px; min-width:0; }
    .avatar { width:56px; height:56px; border-radius:16px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#E0ECFF,#F0E7FF); color:var(--blue); font:800 1.35rem 'Playfair Display',serif; flex-shrink:0; }
    .name { font-size:1.25rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .meta { color:var(--muted); font-size:.9rem; margin-top:3px; font-weight:600; }
    .status-pill { border-radius:999px; padding:8px 13px; font:800 .78rem 'IBM Plex Mono',monospace; white-space:nowrap; }
    .improved { background:#DCFCE7; color:#166534; } .same { background:#E0E7FF; color:#3730A3; } .decreased { background:#FEE2E2; color:#991B1B; }
    .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:18px; }
    .metric { padding:20px; border-radius:18px; border:1px solid var(--line); background:#fff; box-shadow:0 12px 30px rgba(15,23,42,.04); min-height:148px; display:flex; flex-direction:column; justify-content:space-between; }
    .metric-label { color:#40527A; font-size:.82rem; font-weight:800; }
    .metric-value { font:800 2.35rem 'IBM Plex Mono',monospace; margin:10px 0 2px; }
    .metric-sub { color:var(--muted); font-weight:700; font-size:.86rem; }
    .metric.blue .metric-value { color:var(--blue); } .metric.purple .metric-value { color:var(--purple); } .metric.green .metric-value { color:var(--green); } .metric.amber .metric-value { color:var(--amber); } .metric.red .metric-value { color:var(--red); }
    .grid { display:grid; grid-template-columns:1.08fr .92fr; gap:18px; }
    .score-sections { display:grid; gap:18px; margin-top:18px; }
    .chapter-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
    .chapter-card { padding:22px; }
    .chapter-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:16px; }
    .chapter-title { font-size:1.05rem; font-weight:800; }
    .chapter-final { text-align:right; font-weight:800; color:var(--muted); }
    .chapter-final strong { display:block; color:var(--ink); font:800 1.6rem 'IBM Plex Mono',monospace; }
    .score-list { display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); gap:10px; }
    .score-cell { border:1px solid var(--line); background:#F8FBFF; border-radius:14px; padding:12px; min-height:78px; }
    .score-cell-label { color:#52617F; font:.72rem 'IBM Plex Mono',monospace; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
    .score-cell-value { margin-top:8px; color:var(--ink); font:800 1.35rem 'IBM Plex Mono',monospace; }
    .score-cell.summative { background:#FFF7ED; border-color:#FED7AA; }
    .score-cell.summative .score-cell-value { color:#C2410C; }
    .asat-panel { padding:22px; display:grid; grid-template-columns:1fr auto; gap:18px; align-items:center; }
    .asat-score { font:800 2.3rem 'IBM Plex Mono',monospace; color:var(--purple); }
    .asat-side { text-align:right; min-width:180px; }
    .asat-details { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
    .asat-chip { border:1px solid var(--line); background:#F8FBFF; color:#40527A; border-radius:999px; padding:7px 10px; font:800 .76rem 'IBM Plex Mono',monospace; }
    .asat-chip.good { border-color:#BBF7D0; background:#F0FDF4; color:#166534; }
    .asat-chip.warn { border-color:#FED7AA; background:#FFF7ED; color:#9A3412; }
    .section { padding:22px; }
    .section-title { font-size:1rem; font-weight:800; margin-bottom:16px; }
    .message { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:22px; margin-bottom:18px; background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 12px 30px rgba(15,23,42,.04); }
    .message-main { display:flex; align-items:center; gap:16px; }
    .message-icon { width:68px; height:68px; border-radius:20px; background:#ECFDF5; color:var(--green); display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:800; }
    .message-text { font-size:1.05rem; line-height:1.55; font-weight:700; }
    .bars { display:grid; gap:16px; }
    .bar-row { display:grid; grid-template-columns:96px 1fr 58px; gap:14px; align-items:center; font-weight:800; }
    .bar-track { height:14px; background:#E8EEF8; border-radius:999px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg,var(--blue),var(--purple)); width:0; transition:width .4s ease; }
    .breakdown { display:grid; gap:12px; }
    .band { display:grid; grid-template-columns:86px 1fr 56px; gap:12px; align-items:center; color:var(--muted); font-weight:800; }
    .mini-track { height:10px; background:#E8EEF8; border-radius:999px; overflow:hidden; }
    .mini-fill { height:100%; background:var(--blue); border-radius:999px; }
    .remedial { margin-top:18px; display:grid; grid-template-columns:1fr auto; gap:18px; align-items:center; padding:22px; border-radius:18px; border:1px solid #FED7AA; background:linear-gradient(135deg,#FFF7ED,#FFFFFF); }
    .remedial.good { border-color:#BBF7D0; background:linear-gradient(135deg,#F0FDF4,#FFFFFF); }
    .remedial-title { font-size:1.2rem; font-weight:800; margin-bottom:6px; }
    .remedial-copy { color:var(--muted); font-weight:700; line-height:1.55; }
    .table-wrap { overflow-x:auto; }
    table { width:100%; border-collapse:collapse; min-width:620px; }
    th, td { padding:13px 14px; border-bottom:1px solid var(--line); text-align:center; font-weight:700; }
    th { color:#40527A; background:#F8FBFF; font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; }
    td:first-child, th:first-child { text-align:left; }
    .you-row { background:#F0FDF4; }
    footer { padding:24px; text-align:center; color:var(--muted); font-size:.86rem; font-weight:700; }
    footer strong { color:var(--purple); }
    .sidebar-overlay { position:fixed; inset:0; background:rgba(7,15,43,.58); backdrop-filter:blur(6px); z-index:300; opacity:0; pointer-events:none; transition:opacity .25s; }
    .sidebar-overlay.open { opacity:1; pointer-events:all; }
    .sidebar { position:fixed; top:0; right:0; width:min(320px,85vw); height:100%; background:#1E1040; z-index:301; transform:translateX(100%); transition:transform .3s; display:flex; flex-direction:column; overflow-y:auto; }
    .sidebar.open { transform:translateX(0); }
    .sidebar-head { padding:24px 20px 16px; border-bottom:1px solid rgba(255,255,255,.08); display:flex; align-items:center; gap:12px; }
    .sidebar-logo { width:36px; height:36px; border-radius:10px; object-fit:cover; }
    .sidebar-head-title { font-family:'Playfair Display',serif; font-size:1rem; font-weight:800; color:#fff; }
    .sidebar-head-sub { font-size:.7rem; color:rgba(255,255,255,.45); margin-top:1px; }
    .sidebar-close { width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.08); border:none; color:rgba(255,255,255,.5); cursor:pointer; font-size:1rem; padding:0; }
    .sidebar-section { padding:14px 16px 4px; }
    .sidebar-section-label { font-size:.65rem; font-weight:700; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.12em; font-family:'IBM Plex Mono',monospace; padding:0 4px; margin-bottom:6px; }
    .sidebar-item { display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px; text-decoration:none; margin-bottom:2px; }
    .sidebar-item:hover, .sidebar-item.active { background:rgba(255,255,255,.1); }
    .sidebar-item-icon { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:.95rem; flex-shrink:0; }
    .sidebar-item-name { font-size:.88rem; font-weight:600; color:#fff; flex:1; }
    .sidebar-divider { height:1px; background:rgba(255,255,255,.07); margin:8px 16px; }
    .sidebar-home-btn { display:flex; align-items:center; gap:10px; margin:12px 16px 4px; padding:11px 14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:12px; text-decoration:none; }
    .sidebar-home-btn-text { font-size:.85rem; font-weight:700; color:#fff; }
    .sidebar-home-btn-sub { font-size:.7rem; color:rgba(255,255,255,.4); }
    @media (max-width:900px) {
      .picker, .grid, .remedial, .chapter-grid, .asat-panel { grid-template-columns:1fr; }
      .cards { grid-template-columns:repeat(2,1fr); }
      .student-head, .message { align-items:flex-start; flex-direction:column; }
    }
    @media (max-width:560px) {
      main { padding-left:14px; padding-right:14px; }
      .cards { grid-template-columns:1fr; }
      .name { white-space:normal; }
      .bar-row { grid-template-columns:80px 1fr 48px; }
    }
  </style>
  <script src="sidebar.js"></script>
  <script src="security-lock.js?v=20260522b"></script>
</head>
<body data-page="scores">
  <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
  <header class="hero">
    <div class="hero-inner">
      <div class="topline">
        <img class="logo" src="logo.jpg" alt="English Quest"/>
        <div class="brand"><div class="brand-title">English Quest</div><div class="brand-sub">SMA Negeri 6 Surakarta</div></div>
      </div>
      <h1>Final Score Dashboard</h1>
      <p class="hero-copy">See your task scores, summative scores, ASAT status, and the remedial or enrichment group you need.</p>
    </div>
  </header>
  <svg class="wave" viewBox="0 0 1440 48" preserveAspectRatio="none" aria-hidden="true">
    <path fill="#F8FBFF" d="M0,16 C360,54 1080,-10 1440,22 L1440,48 L0,48 Z"></path>
  </svg>

  <main>
    <section class="panel picker">
      <div>
        <label for="classSelect">Your Class</label>
        <select id="classSelect" onchange="loadStudents()"></select>
      </div>
      <div>
        <label for="studentSelect">Your Name</label>
        <select id="studentSelect"></select>
      </div>
      <button id="viewBtn" onclick="viewDashboard()">View Score</button>
    </section>
    <div id="state" class="panel state"><div class="spinner"></div>Loading students...</div>
    <section id="dashboard" class="dashboard"></section>
  </main>

  <footer>© 2026 <strong>English Quest</strong> · Final score dashboard</footer>

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbxetSr-mhLVgk_gHeWaWLk-zDmQ1NYUv7yOK4X93Zn42nGb37U8RFAMaNHLfX20Hak9/exec';
    const SCORE_SHEET_ID = '1UjlcC2zOy5usrkzwL1gqgt3BDfNFb-heak-jdeIxIcM';
    const REMEDIAL_LINKS = {
      enrichment: 'https://chat.whatsapp.com/L9isr7aTbeJKZh5YeMCnBE',
      gap1: 'https://chat.whatsapp.com/JTrmrhnBz1v0yhBpMGatpZ',
      gap2: 'https://chat.whatsapp.com/GIIRbntJuQYK32dwI3xnEV',
      gap3: 'https://chat.whatsapp.com/BnUByekB5QR3wvMb3Vkmf4'
    };
    const CLASSES = ['XE1','XE4','XE5','XE6','XE7','XE8','XE9','XE10','XE11'];
    const CLASS_LABELS = { XE1:'X E-1', XE4:'X E-4', XE5:'X E-5', XE6:'X E-6', XE7:'X E-7', XE8:'X E-8', XE9:'X E-9', XE10:'X E-10', XE11:'X E-11' };
    const MISSING_STUDENTS = {
      XE5: [{ no:'missing-XE5-2', displayNo:'2', name:'AIRA KARUNIA PRATIWI' }]
    };
    let students = [];

    function apiGet(params) {
      return new Promise(function(resolve, reject) {
        const cb = 'eq_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        params.callback = cb;
        window[cb] = function(data) {
          delete window[cb];
          if (script.parentNode) script.parentNode.removeChild(script);
          resolve(data);
        };
        const script = document.createElement('script');
        script.onerror = function() {
          delete window[cb];
          reject(new Error('Could not connect to the score database.'));
        };
        script.src = API + '?' + new URLSearchParams(params).toString();
        document.body.appendChild(script);
      });
    }

    function scoreGet(params) {
      if (params.action === 'getFinalDashboardStudents') return directStudents(params.className);
      if (params.action === 'getFinalDashboard') return directDashboard(params.className, params.studentNo);
      return apiGet(params).catch(function() {
        if (params.action === 'getFinalDashboardStudents') return directStudents(params.className);
        if (params.action === 'getFinalDashboard') return directDashboard(params.className, params.studentNo);
        throw new Error('Could not connect to the score database.');
      });
    }

    function gvizRows(sheetName) {
      return new Promise(function(resolve, reject) {
        const cb = 'eq_sheet_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        window[cb] = function(payload) {
          delete window[cb];
          if (script.parentNode) script.parentNode.removeChild(script);
          try {
            const table = payload && payload.table ? payload.table : { cols: [], rows: [] };
            const matrix = [];
            matrix.push(table.cols.map(function(col, index) {
              return cleanHeader(col.label || col.id || ('Column ' + (index + 1)));
            }));
            table.rows.forEach(function(row) {
              matrix.push(table.cols.map(function(_, index) {
                const cell = row.c && row.c[index] ? row.c[index] : null;
                return cell ? (cell.v == null ? '' : cell.v) : '';
              }));
            });
            const headerIndex = findHeaderRow(matrix);
            if (headerIndex < 0) throw new Error('Could not read the score sheet headers.');
            const headers = matrix[headerIndex].map(cleanHeader);
            const rows = matrix.slice(headerIndex + 1).map(function(values) {
              const item = {};
              headers.forEach(function(header, index) {
                const key = Object.prototype.hasOwnProperty.call(item, header) ? header + ' ' + (index + 1) : header;
                item[key] = values[index] == null ? '' : values[index];
              });
              return item;
            }).filter(function(row) { return field(row, ['No']) !== '' && field(row, ['Name']) !== ''; });
            resolve(rows);
          } catch (err) {
            reject(err);
          }
        };
        const script = document.createElement('script');
        script.onerror = function() {
          delete window[cb];
          reject(new Error('Could not load the public score sheet.'));
        };
        script.src = 'https://docs.google.com/spreadsheets/d/' + SCORE_SHEET_ID + '/gviz/tq?' +
          new URLSearchParams({ sheet: sheetName, tqx: 'out:json;responseHandler:' + cb }).toString();
        document.body.appendChild(script);
      });
    }

    function findHeaderRow(matrix) {
      for (let i = 0; i < Math.min(matrix.length, 10); i++) {
        const row = matrix[i].map(function(cell) { return cleanHeader(cell).toLowerCase(); });
        const hasName = row.indexOf('name') !== -1;
        const hasNo = row.some(function(text) { return text === 'no' || text === 'student no.' || text === 'student no'; });
        const hasScoreMarker = row.indexOf('asat') !== -1 || row.indexOf('class') !== -1 || row.some(function(text) { return text.indexOf('sem 1 final') !== -1; });
        if (hasName && hasNo && hasScoreMarker) return i;
      }
      return -1;
    }

    function cleanHeader(header) {
      const h = String(header || '').trim().replace(/\s+/g, ' ');
      if (/^no\.?$/i.test(h)) return 'No';
      if (/score tracker.*no\.?$/i.test(h)) return 'No';
      if (/comparison no\.?$/i.test(h)) return 'No';
      return h;
    }

    function field(row, names) {
      for (const name of names) {
        if (Object.prototype.hasOwnProperty.call(row, name)) return row[name];
      }
      const keys = Object.keys(row);
      for (const name of names) {
        const wanted = String(name).toLowerCase();
        const key = keys.find(function(k) { return k.toLowerCase() === wanted; });
        if (key) return row[key];
      }
      return '';
    }

    function normalizeName(value) {
      return String(value || '').trim().replace(/\s+/g, ' ').toUpperCase();
    }

    function num(value) {
      if (value === '' || value === null || value === undefined || value === '-') return '';
      const n = Number(value);
      return isNaN(n) ? '' : n;
    }

    function directStudents(className) {
      return gvizRows(className).then(function(rows) {
        const listed = rows.map(function(row) {
          return { no: field(row, ['No']), displayNo: field(row, ['No']), name: field(row, ['Name']) };
        });
        (MISSING_STUDENTS[className] || []).forEach(function(student) {
          if (!listed.some(function(item) { return normalizeName(item.name) === normalizeName(student.name); })) {
            listed.splice(Math.max(0, Number(student.displayNo) - 1), 0, student);
          }
        });
        return {
          success: true,
          className: className,
          students: listed
        };
      });
    }

    function directDashboard(className, studentNo) {
      const missing = (MISSING_STUDENTS[className] || []).find(function(student) {
        return String(student.no) === String(studentNo);
      });
      if (missing) return Promise.resolve(missingDashboard(className, missing));
      return Promise.all([gvizRows(className), gvizRows('Sem 1 vs Sem 2')]).then(function(results) {
        const scoreRows = results[0];
        const semRows = results[1].filter(function(row) { return field(row, ['Class']) === className; });
        const row = scoreRows.find(function(item) { return String(field(item, ['No'])).trim() === String(studentNo).trim(); });
        if (!row) return { success: false, error: 'Student not found' };
        const sem = semRows.find(function(item) { return String(field(item, ['Student No.','Student No'])).trim() === String(studentNo).trim(); }) || {};
        const asatScore = field(row, ['ASAT']);
        const asatGap = field(row, ['ASAT Gap']);
        const sem1 = field(sem, ['Sem 1 Final (AK)']);
        const sem2 = field(row, ['Final Score Sem 2']) || field(sem, ['Sem 2 Average (R)']);
        const diff = field(sem, ['Difference']);
        const student = {
          className: className,
          studentNo: field(row, ['No']),
          name: field(row, ['Name']),
          sem1: sem1,
          sem2: sem2,
          difference: diff,
          result: field(sem, ['Result']) || resultFromDiff(diff)
        };
        return {
          success: true,
          className: className,
          classLabel: CLASS_LABELS[className] || className,
          student: student,
          chapters: [directChapter(row, 4), directChapter(row, 5)],
          overall: { student: { calc: { Average: sem2, 'Final Score': sem2 } } },
          asat: {
            score: asatScore,
            gap: asatGap,
            remedial: field(row, ['Remedial']),
            lacking: field(row, ['Lacking'])
          },
          remedial: remedialFor(asatScore, asatGap, field(row, ['Remedial'])),
          summary: {
            classSize: semRows.length || scoreRows.length,
            completedSem2Count: semRows.length || scoreRows.length,
            sem1Average: average(semRows.map(function(item) { return field(item, ['Sem 1 Final (AK)']); })),
            sem2Average: average(semRows.map(function(item) { return field(item, ['Sem 2 Average (R)']); })),
            rankSem1: rankRows(semRows, studentNo, 'Sem 1 Final (AK)'),
            rankSem2: rankRows(semRows, studentNo, 'Sem 2 Average (R)')
          },
          updatedAt: new Date().toISOString()
        };
      });
    }

    function missingDashboard(className, missing) {
      return {
        success: true,
        className: className,
        classLabel: CLASS_LABELS[className] || className,
        student: {
          className: className,
          studentNo: missing.displayNo,
          name: missing.name,
          sem1: '',
          sem2: '',
          difference: '',
          result: 'Waiting'
        },
        chapters: [emptyChapter(missing, 4), emptyChapter(missing, 5)],
        overall: { student: { calc: { Average: '', 'Final Score': '' } } },
        asat: { score: '', gap: '', remedial: '', lacking: 'Score row missing from final-score spreadsheet' },
        remedial: { type:'pending', label:'Waiting for score data', task:'Your name is on the student roster, but your final-score row is not available in the score spreadsheet yet.', gap:'', link:'', linkLabel:'No group yet' },
        summary: { classSize:'', completedSem2Count:'', sem1Average:'', sem2Average:'', rankSem1:'', rankSem2:'' },
        updatedAt: new Date().toISOString()
      };
    }

    function emptyChapter(student, chapter) {
      const count = chapter === 4 ? 7 : 5;
      const inputCols = [];
      const scores = {};
      for (let i = 1; i <= count; i++) {
        const label = 'Task ' + i;
        inputCols.push(label);
        scores[label] = '';
      }
      inputCols.push('Summative');
      scores.Summative = '';
      return {
        chapter: chapter,
        inputCols: inputCols,
        student: { no: student.displayNo, name: student.name, scores: scores, average: '', finalScore: '', indicator: 'Waiting for score data' }
      };
    }

    function directChapter(row, chapter) {
      const count = chapter === 4 ? 7 : 5;
      const inputCols = [];
      const scores = {};
      for (let i = 1; i <= count; i++) {
        const label = 'Task ' + i;
        inputCols.push(label);
        scores[label] = field(row, ['Ch. ' + chapter + ' Task ' + i]);
      }
      inputCols.push('Summative');
      scores.Summative = field(row, ['Summative Ch. ' + chapter]);
      return {
        chapter: chapter,
        inputCols: inputCols,
        student: {
          no: field(row, ['No']),
          name: field(row, ['Name']),
          scores: scores,
          average: average(inputCols.map(function(col) { return scores[col]; })),
          finalScore: average(inputCols.map(function(col) { return scores[col]; })),
          indicator: average(inputCols.map(function(col) { return scores[col]; })) >= 75 ? 'Safe' : 'Needs work'
        }
      };
    }

    function remedialFor(asatScore, gapValue, taskText) {
      const scoreNum = num(asatScore);
      const gapNum = num(gapValue);
      if (scoreNum === '' && gapNum === '') {
        return { type:'pending', label:'Waiting for ASAT', task:'Your ASAT score is not available yet.', gap:'', link:'', linkLabel:'No group yet' };
      }
      const gap = gapNum === '' ? Math.max(0, Math.ceil((75 - scoreNum) * 100) / 100) : Math.max(0, gapNum);
      if (gap <= 0) return { type:'enrichment', label:'Enrichment', task: taskText || 'No remedial needed. You may join enrichment to improve your ASAT score by 1-10 points.', gap:0, link:REMEDIAL_LINKS.enrichment, linkLabel:'Join Enrichment Group' };
      if (gap <= 15) return { type:'gap1', label:'Gap 1-15', task: taskText || 'Read a paragraph offline and meet the teacher.', gap:gap, link:REMEDIAL_LINKS.gap1, linkLabel:'Join Gap 1-15 Group' };
      if (gap <= 25) return { type:'gap2', label:'Gap 16-25', task: taskText || 'Make a poster summary of Semester 2 material.', gap:gap, link:REMEDIAL_LINKS.gap2, linkLabel:'Join Gap 16-25 Group' };
      return { type:'gap3', label:'Gap 26+', task: taskText || 'Write a complete written summary of Semester 2 material.', gap:gap, link:REMEDIAL_LINKS.gap3, linkLabel:'Join Gap 26+ Group' };
    }

    function resultFromDiff(value) {
      const n = num(value);
      return n === '' ? 'Waiting' : n > 0 ? 'Improved' : n < 0 ? 'Decreased' : 'Same';
    }

    function average(values) {
      const nums = values.map(num).filter(function(value) { return value !== ''; });
      if (!nums.length) return '';
      return Math.round((nums.reduce(function(a, b) { return a + b; }, 0) / nums.length) * 100) / 100;
    }

    function rankRows(rows, studentNo, fieldName) {
      const ranked = rows.map(function(row) {
        return { no: String(field(row, ['Student No.','Student No'])).trim(), score: num(field(row, [fieldName])) };
      }).filter(function(item) { return item.score !== ''; }).sort(function(a, b) { return b.score - a.score; });
      const index = ranked.findIndex(function(item) { return item.no === String(studentNo).trim(); });
      return index < 0 ? '' : index + 1;
    }

    function init() {
      const clsSel = document.getElementById('classSelect');
      clsSel.innerHTML = CLASSES.map(function(cls) { return '<option value="' + cls + '">' + CLASS_LABELS[cls] + '</option>'; }).join('');
      const qs = new URLSearchParams(location.search);
      const savedClass = qs.get('cls') || localStorage.getItem('eq_student_class') || 'XE1';
      const savedNo = qs.get('no') || localStorage.getItem('eq_student_no') || '';
      if (CLASSES.indexOf(savedClass) !== -1) clsSel.value = savedClass;
      loadStudents(savedNo);
    }

    function setState(html) {
      document.getElementById('state').style.display = 'block';
      document.getElementById('state').innerHTML = html;
      document.getElementById('dashboard').style.display = 'none';
    }

    function loadStudents(preselectNo) {
      const cls = document.getElementById('classSelect').value;
      const sel = document.getElementById('studentSelect');
      sel.innerHTML = '<option>Loading...</option>';
      setState('<div class="spinner"></div>Loading students...');
      scoreGet({ action:'getFinalDashboardStudents', className:cls }).then(function(res) {
        if (!res.success) throw new Error(res.error || 'Could not load students');
        students = res.students || [];
        sel.innerHTML = '<option value="">Select your name</option>' + students.map(function(s) {
          return '<option value="' + escapeHtml(s.no) + '">' + escapeHtml(s.name) + '</option>';
        }).join('');
        if (preselectNo) sel.value = preselectNo;
        setState('Choose your name, then open your final score dashboard.');
        if (preselectNo && sel.value) viewDashboard();
      }).catch(function(err) {
        sel.innerHTML = '<option value="">Could not load</option>';
        setState('Could not load students: ' + escapeHtml(err.message));
      });
    }

    function viewDashboard() {
      const cls = document.getElementById('classSelect').value;
      const no = document.getElementById('studentSelect').value;
      if (!cls || !no) return setState('Please select your class and name first.');
      document.getElementById('viewBtn').disabled = true;
      setState('<div class="spinner"></div>Loading your dashboard...');
      scoreGet({ action:'getFinalDashboard', className:cls, studentNo:no }).then(function(res) {
        document.getElementById('viewBtn').disabled = false;
        if (!res.success) throw new Error(res.error || 'Could not load score');
        render(res);
      }).catch(function(err) {
        document.getElementById('viewBtn').disabled = false;
        setState('Could not load score: ' + escapeHtml(err.message));
      });
    }

    function render(data) {
      const s = data.student;
      const sum = data.summary || {};
      const rem = data.remedial || {};
      const asat = data.asat || {};
      const diff = Number(s.difference);
      const diffClass = isNaN(diff) ? 'amber' : diff > 0 ? 'green' : diff < 0 ? 'red' : 'blue';
      const statusClass = String(s.result || '').toLowerCase() === 'improved' ? 'improved' : String(s.result || '').toLowerCase() === 'same' ? 'same' : 'decreased';
      localStorage.setItem('eq_student_class', data.className);
      localStorage.setItem('eq_student_no', s.studentNo);
      localStorage.setItem('eq_student_name', s.name);

      const html =
        '<div class="panel student-head">' +
          '<div class="identity"><div class="avatar">' + escapeHtml(String(s.name || '?').charAt(0)) + '</div><div><div class="name">' + escapeHtml(s.name) + '</div><div class="meta">' + escapeHtml(data.classLabel) + ' · Student No. ' + escapeHtml(s.studentNo) + '</div></div></div>' +
          '<span class="status-pill ' + statusClass + '">' + escapeHtml(s.result || 'Waiting') + '</span>' +
        '</div>' +
        '<div class="cards">' +
          metric('Semester 1', score(s.sem1), rank(sum.rankSem1, sum.classSize), 'blue') +
          metric('Semester 2', score(s.sem2), rank(sum.rankSem2, sum.classSize), 'purple') +
          metric('Difference', signed(diff), differenceText(diff), diffClass) +
          metric('ASAT Gap', asat.gap === 0 ? '0' : asat.gap || '-', rem.label || 'Waiting', rem.type === 'enrichment' ? 'green' : rem.type === 'pending' ? 'amber' : 'red') +
        '</div>' +
        messageBlock(s, diff, statusClass) +
        '<div class="score-sections">' +
          '<div class="chapter-grid">' + chapterCard(data.chapters && data.chapters[0]) + chapterCard(data.chapters && data.chapters[1]) + '</div>' +
          asatBlock(data) +
          '<div class="panel section"><div class="section-title">Final Score Comparison</div><div class="bars">' + bar('Semester 1 Final', s.sem1) + bar('Semester 2 Final', s.sem2) + '</div></div>' +
        '</div>' +
        remedialBlock(rem) +
        '<div class="panel section" style="margin-top:18px;"><div class="section-title">Detailed Comparison</div><div class="table-wrap">' +
          '<table><thead><tr><th>Item</th><th>Your Score</th><th>Context</th><th>Status</th></tr></thead><tbody>' +
          '<tr class="you-row"><td>Chapter 4 Final</td><td>' + chapterFinal(data.chapters && data.chapters[0]) + '</td><td>Tasks + Summative</td><td>' + indicator(data.chapters && data.chapters[0]) + '</td></tr>' +
          '<tr class="you-row"><td>Chapter 5 Final</td><td>' + chapterFinal(data.chapters && data.chapters[1]) + '</td><td>Tasks + Summative</td><td>' + indicator(data.chapters && data.chapters[1]) + '</td></tr>' +
          '<tr class="you-row"><td>ASAT</td><td>' + score(asat.score) + '</td><td>Separated from task and summative scores</td><td>' + escapeHtml(rem.label || '-') + '</td></tr>' +
          '<tr><td>Semester 1 Final Score</td><td>' + score(s.sem1) + '</td><td>' + rank(sum.rankSem1, sum.classSize) + '</td><td>' + escapeHtml(s.result || '-') + '</td></tr>' +
          '<tr><td>Semester 2 Final Score</td><td>' + score(s.sem2) + '</td><td>' + rank(sum.rankSem2, sum.classSize) + '</td><td>' + escapeHtml(rem.label || '-') + '</td></tr>' +
          '</tbody></table></div></div>';
      document.getElementById('state').style.display = 'none';
      const dash = document.getElementById('dashboard');
      dash.innerHTML = html;
      dash.style.display = 'block';
    }

    function metric(label, value, sub, tone) {
      return '<div class="metric ' + tone + '"><div><div class="metric-label">' + escapeHtml(label) + '</div><div class="metric-value">' + escapeHtml(value) + '</div></div><div class="metric-sub">' + escapeHtml(sub) + '</div></div>';
    }
    function messageBlock(s, diff, statusClass) {
      const text = isNaN(diff) ? 'Your comparison is waiting for complete data.' :
        diff > 0 ? 'Great job. Your final score improved by ' + score(Math.abs(diff)) + ' points from Semester 1 to Semester 2.' :
        diff < 0 ? 'Your score decreased by ' + score(Math.abs(diff)) + ' points. Use the remedial guidance below to recover with a clear next step.' :
        'Your final score stayed stable. Check your task, summative, and ASAT details below for the exact picture.';
      const mark = statusClass === 'improved' ? '+' : statusClass === 'same' ? '=' : '!';
      return '<div class="message"><div class="message-main"><div class="message-icon">' + mark + '</div><div class="message-text">' + escapeHtml(text) + '</div></div><span class="status-pill ' + statusClass + '">' + escapeHtml(s.result || 'Waiting') + '</span></div>';
    }
    function chapterCard(chapter) {
      if (!chapter || !chapter.student) return '<div class="panel chapter-card"><div class="chapter-title">Chapter</div><div class="meta">No score data yet.</div></div>';
      const st = chapter.student;
      const cells = (chapter.inputCols || []).map(function(col) {
        const isSumm = /summative/i.test(col);
        return '<div class="score-cell ' + (isSumm ? 'summative' : '') + '"><div class="score-cell-label">' + escapeHtml(col) + '</div><div class="score-cell-value">' + score(st.scores ? st.scores[col] : '') + '</div></div>';
      }).join('');
      return '<div class="panel chapter-card"><div class="chapter-head"><div><div class="chapter-title">Chapter ' + escapeHtml(chapter.chapter) + '</div><div class="meta">Task scores and summative score</div></div><div class="chapter-final">Final<strong>' + score(st.finalScore) + '</strong></div></div><div class="score-list">' + cells + '</div></div>';
    }
    function asatBlock(data) {
      const asat = data.asat || {};
      const rem = data.remedial || {};
      const gap = asat.gap === 0 ? '0' : score(asat.gap);
      const lacking = asat.lacking ? escapeHtml(asat.lacking) : 'Complete';
      const statusClass = rem.type === 'enrichment' ? 'good' : rem.type === 'pending' ? 'warn' : 'warn';
      return '<div class="panel asat-panel"><div><div class="section-title">ASAT Result</div><div class="meta">ASAT is separate from task and summative scores. Your remedial or enrichment group is based on this score.</div><div class="asat-details"><span class="asat-chip ' + statusClass + '">' + escapeHtml(rem.label || 'Waiting') + '</span><span class="asat-chip">Gap: ' + gap + '</span><span class="asat-chip">Lacking: ' + lacking + '</span></div></div><div class="asat-side"><div class="score-cell-label">ASAT Score</div><div class="asat-score">' + score(asat.score) + '</div></div></div>';
    }
    function chapterFinal(chapter) {
      return chapter && chapter.student ? score(chapter.student.finalScore) : '-';
    }
    function indicator(chapter) {
      return chapter && chapter.student ? escapeHtml(chapter.student.indicator || '-') : '-';
    }
    function remedialBlock(rem) {
      const good = rem.type === 'enrichment';
      const href = rem.link ? ' href="' + escapeHtml(rem.link) + '" target="_blank" rel="noopener"' : '';
      return '<div class="remedial ' + (good ? 'good' : '') + '"><div><div class="remedial-title">' + escapeHtml(rem.label || 'Remedial') + '</div><div class="remedial-copy">' + escapeHtml(rem.task || '') + '</div></div>' +
        (rem.link ? '<a class="cta" ' + href + '>' + escapeHtml(rem.linkLabel || 'Join Group') + '</a>' : '<span class="status-pill same">No link yet</span>') + '</div>';
    }
    function bar(label, value) {
      const n = Number(value);
      const pct = isNaN(n) ? 0 : Math.max(0, Math.min(100, n));
      return '<div class="bar-row"><div>' + escapeHtml(label) + '</div><div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div><div>' + score(value) + '</div></div>';
    }
    function bands(items) {
      if (!items.length) return '<div class="state" style="padding:18px;">No class data yet.</div>';
      return items.map(function(b, i) {
        const colors = ['#22C55E','#2563EB','#F59E0B','#EF4444'];
        return '<div class="band"><div>' + escapeHtml(b.label) + '</div><div class="mini-track"><div class="mini-fill" style="width:' + Number(b.percent || 0) + '%;background:' + colors[i] + '"></div></div><div>' + escapeHtml(String(b.count || 0)) + '</div></div>';
      }).join('');
    }
    function score(v) {
      if (v === '' || v === null || v === undefined || v === '-') return '-';
      const n = Number(v);
      return isNaN(n) ? '-' : n.toFixed(2).replace(/\.00$/, '');
    }
    function signed(n) {
      return isNaN(n) ? '-' : (n > 0 ? '+' : '') + score(n);
    }
    function differenceText(n) {
      return isNaN(n) ? 'Waiting data' : n > 0 ? 'Improved' : n < 0 ? 'Decreased' : 'Same score';
    }
    function rank(r, total) {
      return r ? 'Rank ' + r + ' of ' + total : 'No rank yet';
    }
    function escapeHtml(value) {
      return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
        return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[ch];
      });
    }
    init();
  </script>
</body>
</html>
