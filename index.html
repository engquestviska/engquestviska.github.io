<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>English Quest · Choose Grade</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="shared/css/system.css?v=20260702"/>
</head>
<body class="landing-page">
  <div class="topbar">
    <div class="brand">
      <img src="logo.jpg" alt="English Quest Logo"/>
      <div>
        <div class="brand-title">English Quest</div>
        <div class="brand-sub">SMA Negeri 6 Surakarta</div>
      </div>
    </div>
  </div>

  <main>
    <section>
      <h1>Choose your grade.</h1>
      <p class="intro-copy">Open your grade to see your tasks, scores, and class materials.</p>
    </section>

    <section class="choice-grid" aria-label="Grade choices">
      <a class="grade-card ten" href="grade10/" onclick="chooseGrade('10')">
        <div>
          <div class="grade-meta">
            <div class="grade-label">5 Classes</div>
            <div class="grade-number">10</div>
          </div>
          <div class="grade-title">Grade 10</div>
          <div class="grade-copy">Classes E-1 to E-5.</div>
        </div>
        <div class="grade-action">Open Grade 10 <span>→</span></div>
      </a>

      <a class="grade-card eleven" href="grade11/" onclick="chooseGrade('11')">
        <div>
          <div class="grade-meta">
            <div class="grade-label">3 Classes</div>
            <div class="grade-number">11</div>
          </div>
          <div class="grade-title">Grade 11</div>
          <div class="grade-copy">Classes F-7 to F-9.</div>
        </div>
        <div class="grade-action">Open Grade 11 <span>→</span></div>
      </a>
    </section>
  </main>

  <footer>© 2026 English Quest · SMA Negeri 6 Surakarta</footer>

  <script>
    function chooseGrade(grade) {
      localStorage.setItem('eq_grade', grade);
      if (grade === '11') {
        localStorage.removeItem('eq_student_class');
        localStorage.removeItem('eq_student_no');
        localStorage.removeItem('eq_student_name');
        localStorage.removeItem('eq_setup_skipped');
      }
    }
  </script>
</body>
</html>
